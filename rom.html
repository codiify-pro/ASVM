<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<style>
/* Ultra-Modern SaaS Variables */
:root {
  --bg-base: #09090b;
  --bg-panel: rgba(24, 24, 27, 0.45);
  --bg-glass: rgba(255, 255, 255, 0.03);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f8fafc;
  --text-muted: #a1a1aa;
  
  --accent-mint: #10b981; 
  --accent-glow: rgba(16, 185, 129, 0.2);
  
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  
  --plyr-color-main: #10b981;
  --plyr-video-background: #000000;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

body {
  margin: 0;
  background: var(--bg-base);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  overflow: hidden; 
  height: 100dvh; 
  display: flex;
  flex-direction: column;
}

/* Ambient Background Elements */
.ambient-glow {
  position: fixed; 
  border-radius: 50%;
  filter: blur(140px);
  z-index: -1;
  opacity: 0.4;
  pointer-events: none;
}
.glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent-glow); }
.glow-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: rgba(56, 189, 248, 0.1); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar {
  background: rgba(9, 9, 11, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 0 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  height: 70px; 
  flex-shrink: 0; 
  opacity: 0; /* For Anime.js */
}

.logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent-mint); }

.topbar-actions { display: flex; align-items: center; gap: 12px; }

.room-badge {
  background: rgba(16, 185, 129, 0.1);
  color: var(--accent-mint);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--accent-glow);
}

.share-btn {
  background: var(--bg-glass);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
}
.share-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }

/* ---------------- LAYOUT (BENTO GRID) ---------------- */
.main-container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px; 
  flex: 1; 
  min-height: 0; 
}

@media (min-width: 992px) {
  .main-container { flex-direction: row; }
  .player-section { flex: 2; height: 100%; display: flex; flex-direction: column; }
  .chatBox { flex: 1; height: 100%; }
  .resizer { display: none !important; }
}

/* ---------------- VIDEO PLAYER ---------------- */
.player-section { width: 100%; display: flex; flex-direction: column; opacity: 0; }

.playerWrap {
  width: 100%;
  aspect-ratio: 16 / 9; 
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  border: 1px solid var(--border-color);
  position: relative;
}
.plyr { width: 100%; height: 100%; }

.resizer {
  height: 24px; width: 100%; cursor: ns-resize; display: flex; align-items: center; justify-content: center; opacity: 0.5; margin: 4px 0;
}
.resizer-line { width: 40px; height: 4px; background: var(--text-muted); border-radius: 10px; }

/* ---------------- CHAT UI ---------------- */
.chatBox {
  width: 100%; flex: 1; min-height: 0; 
  background: var(--bg-panel);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0;
}

.chatHeader {
  background: var(--bg-glass);
  padding: 16px 20px;
  font-weight: 600;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border-color);
}
.live-dot { width: 8px; height: 8px; background: var(--accent-mint); border-radius: 50%; box-shadow: 0 0 10px var(--accent-mint); animation: pulse 2s infinite; }

#messages {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
}

/* Message Bubbles */
.msg { display: flex; width: 100%; align-items: flex-end; gap: 8px; }

.msgBox {
  max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-break: break-word;
}

.quote-block {
  background: rgba(0, 0, 0, 0.2); border-left: 3px solid rgba(255,255,255,0.3); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 8px;
}
.quote-name { font-weight: 700; color: var(--accent-mint); margin-bottom: 4px; }

.left { justify-content: flex-start; }
.left .msgBox { background: rgba(255,255,255,0.05); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

.right { justify-content: flex-end; }
.right .msgBox { background: var(--accent-mint); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
.right .quote-name { color: #000; }
.right .quote-block { background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.3); }

.name { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; opacity: 0.7; }

.reply-btn {
  background: transparent; border: none; color: var(--text-muted); cursor: pointer; opacity: 0; transform: translateY(5px); transition: all 0.2s;
}
.msg:hover .reply-btn { opacity: 1; transform: translateY(0); }
.reply-btn:hover { color: var(--accent-mint); }

.reply-preview {
  display: none; background: rgba(0,0,0,0.2); padding: 12px 20px; border-left: 3px solid var(--accent-mint); font-size: 13px; align-items: center; justify-content: space-between;
}
.reply-preview-text { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90%; }
.reply-preview-text strong { color: var(--text-main); }
.cancel-reply { cursor: pointer; color: #ef4444; }

.chatInput { display: flex; padding: 16px; background: rgba(0, 0, 0, 0.3); gap: 12px; align-items: center; }

.chatInput input {
  flex: 1; padding: 14px 18px; border: 1px solid var(--border-color); border-radius: var(--radius-xl); background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 14px; transition: all 0.3s;
}
.chatInput input:focus { border-color: var(--accent-mint); background: rgba(16, 185, 129, 0.05); }

.action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
.action-btn:hover { color: var(--text-main); }

.send-btn {
  background: var(--accent-mint); border: none; color: #000; width: 48px; height: 48px; border-radius: var(--radius-xl); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); }

.popup {
  position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--accent-mint); color: var(--text-main); padding: 12px 24px; border-radius: 30px; font-weight: 500; font-size: 14px; display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
</style>
</head>

<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="topbar-actions">
    <button class="share-btn" onclick="shareRoom()">
      <i data-lucide="share-2" style="width: 16px; height: 16px;"></i> Share
    </button>
    <div class="room-badge" id="roomId"></div>
  </div>
</div>

<div class="main-container">
  <div class="player-section" id="playerContainer">
    <div class="playerWrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="resizer" id="resizer"><div class="resizer-line"></div></div>
  </div>

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <div class="live-dot"></div><span>Live Sync Chat</span>
    </div>
    <div id="messages"></div>
    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-text">Replying to <strong id="replyName"></strong>: <span id="replyText"></span></div>
      <div class="cancel-reply" onclick="cancelReply()"><i data-lucide="x" style="width: 18px; height: 18px;"></i></div>
    </div>
    <div class="chatInput">
      <button class="action-btn" id="emojiButton"><i data-lucide="smile" style="width: 22px; height: 22px;"></i></button>
      <input id="msg" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMsg()"><i data-lucide="send" style="width: 20px; height: 20px; transform: translateX(-2px) translateY(2px);"></i></button>
    </div>
  </div>
</div>

<div class="popup" id="sysPopup"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<script type="module">
import { db, ref, onValue, push, onChildAdded } from "./firebase.js"

// Initialize Lucide Icons
lucide.createIcons();

// Initial Entry Animations (Anime.js)
anime({
  targets: ['.topbar', '.player-section', '.chatBox'],
  translateY: [30, 0],
  opacity: [0, 1],
  delay: anime.stagger(150),
  easing: 'easeOutExpo',
  duration: 1200
});

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
document.getElementById("roomId").innerText = "Room: " + room;

// Cross-device Modern Player Config
const video = document.getElementById("player");
const player = new Plyr(video, {
  controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
  settings: ['captions', 'quality', 'speed'],
  speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
});

let username = localStorage.getItem("asvm_name");
function askName() {
  let name = prompt("Enter your name to join:");
  if (name && name.trim().toLowerCase() !== "asvm") {
    localStorage.setItem("asvm_name", name.trim()); return name.trim();
  }
  return askName(); 
}
if(!username || username.toLowerCase() === "asvm") username = askName();

// Custom Popup with Anime.js
function showPopup(text){
  const p = document.getElementById("sysPopup"); 
  p.innerText = text; p.style.display = "block";
  anime({
    targets: p, translateY: [10, 0], opacity: [0, 1], duration: 400, easing: 'easeOutElastic(1, .8)'
  });
  setTimeout(() => {
    anime({
      targets: p, translateY: -10, opacity: 0, duration: 300, easing: 'easeInQuad', complete: () => p.style.display = "none"
    });
  }, 3000);
}

// Universal Player Logic (YouTube, Vimeo, HLS, MP4)
let sourceLoaded = false;
onValue(ref(db, "rooms/" + room), snap => {
  const data = snap.val(); if(!data) return;
  const url = atob(data.src);
  if(sourceLoaded) return; sourceLoaded = true;

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    const ytId = url.match(/((youtu.be\/)|(v=))([^#&?]*)/)?.[4];
    if(ytId) player.source = { type: 'video', sources: [{ src: ytId, provider: 'youtube' }] };
  } 
  else if (url.includes("vimeo.com")) {
    const vimId = url.match(/(?:www\.|player\.)?vimeo.com\/(?:channels\/(?:\w+\/)?|groups\/(?:[^\/]*)\/videos\/|album\/(?:\d+)\/video\/|video\/|)(\d+)(?:[a-zA-Z0-9_\-]+)?/i)?.[1];
    if(vimId) player.source = { type: 'video', sources: [{ src: vimId, provider: 'vimeo' }] };
  }
  else if (url.includes(".m3u8")) {
    if(Hls.isSupported()){ const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); }
    else if(video.canPlayType('application/vnd.apple.mpegurl')) video.src = url; // iOS fallback
  } else {
    player.source = { type: "video", sources: [{ src: url, type: "video/mp4" }] };
  }
});

/* Mobile Resizer Logic */
const resizer = document.getElementById("resizer");
const playerContainer = document.getElementById("playerContainer");
let isResizing = false;

resizer.addEventListener("touchstart", (e) => { isResizing = true; document.documentElement.addEventListener("touchmove", doDrag); document.documentElement.addEventListener("touchend", stopDrag); });
function doDrag(e) {
  if (!isResizing || window.innerWidth >= 992) return;
  let newHeight = e.touches[0].clientY - playerContainer.getBoundingClientRect().top;
  if (newHeight >= 150) playerContainer.style.height = newHeight + "px";
}
function stopDrag() { isResizing = false; }

/* Chat Core */
let messagesMap = {}; let replyingTo = null;
const msgInput = document.getElementById("msg");
const msgBoxEl = document.getElementById("messages");

// Emojis
const picker = new EmojiButton({ theme: 'dark' });
picker.on('emoji', emoji => { msgInput.value += emoji; msgInput.focus(); });
document.getElementById('emojiButton').addEventListener('click', () => picker.togglePicker(document.getElementById('emojiButton')));

window.handleKeyPress = e => { if(e.key === "Enter") sendMsg(); };
window.initReply = id => {
  const m = messagesMap[id]; if(!m) return;
  replyingTo = { id, name: m.name, text: m.text };
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyName").innerText = m.name;
  document.getElementById("replyText").innerText = m.text;
  msgInput.focus();
}
window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

window.sendMsg = () => {
  const text = msgInput.value; if(!text.trim()) return;
  push(ref(db, "rooms/" + room + "/chat"), { name: username, text, time: Date.now(), reply: replyingTo });
  msgInput.value = ""; cancelReply();
}

onChildAdded(ref(db, "rooms/" + room + "/chat"), snap => {
  const m = snap.val(); messagesMap[snap.key] = m;
  const div = document.createElement("div");
  const isMe = m.name === username;
  div.className = "msg " + (isMe ? "right" : "left");
  
  let quoteHTML = m.reply ? `<div class="quote-block"><div class="quote-name">${m.reply.name}</div><div>${m.reply.text.substring(0,40)}...</div></div>` : "";

  div.innerHTML = `
    ${!isMe ? `<button class="reply-btn" onclick="initReply('${snap.key}')"><i data-lucide="reply" style="width:14px;height:14px;"></i></button>` : ''}
    <div class="msgBox">
      ${quoteHTML}
      <div class="name">${m.name}</div>
      ${m.text}
    </div>
    ${isMe ? `<button class="reply-btn" onclick="initReply('${snap.key}')"><i data-lucide="reply" style="width:14px;height:14px;"></i></button>` : ''}
  `;
  msgBoxEl.appendChild(div);
  lucide.createIcons({ root: div });
  
  // Animate Message Entry
  anime({ targets: div, scale: [0.9, 1], opacity: [0, 1], translateY: [15, 0], duration: 400, easing: 'easeOutQuad' });
  msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
});

window.shareRoom = () => {
  if (navigator.share) navigator.share({ title: 'ASVM', url: window.location.href });
  else { navigator.clipboard.writeText(window.location.href); showPopup("Link copied!"); }
}
</script>
</body>
</html>
