<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASVM - Premium Watch Party</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================
   ULTRA MODERN SaaS THEME (Neon Mint & Dark)
   ========================================= */
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; margin: 0; padding: 0; }
:root {
  --bg-base: #0a0a0c;
  --bg-panel: rgba(20, 20, 25, 0.65);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #8a8a93;
  --accent-mint: #00e5ff; /* Cyan/Mint mix */
  --accent-mint-dim: rgba(0, 229, 255, 0.15);
  
  --radius-xl: 20px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  
  /* Overriding Plyr Colors for Custom Look */
  --plyr-color-main: #00e5ff;
  --plyr-video-background: #000;
  --plyr-menu-background: rgba(20, 20, 25, 0.95);
  --plyr-menu-color: #fff;
}

body {
  background: var(--bg-base); font-family: 'Inter', sans-serif;
  color: var(--text-main); overflow: hidden; height: 100dvh; display: flex; flex-direction: column;
}

/* Background Ambient Glow */
.ambient-glow { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.4; pointer-events: none; }
.glow-1 { top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--accent-mint-dim), transparent 60%); }
.glow-2 { bottom: -20%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(147, 51, 234, 0.1), transparent 60%); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar {
  background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 0 4%; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border-color); height: 65px; flex-shrink: 0; z-index: 1000;
}
.logo { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
.logo span { color: var(--accent-mint); }

.topbar-actions { display: flex; align-items: center; gap: 12px; }

/* Modern Live Badge */
.live-badge {
  display: flex; align-items: center; gap: 8px; background: rgba(239, 68, 68, 0.15);
  color: #ff4757; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
  border: 1px solid rgba(239, 68, 68, 0.3); transition: var(--transition);
}
.live-dot {
  width: 8px; height: 8px; background: #ff4757; border-radius: 50%;
  box-shadow: 0 0 10px #ff4757; animation: pulseLive 1.5s infinite;
}

.room-badge { background: var(--bg-panel); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-color); color: var(--text-muted); }

.share-btn {
  background: var(--accent-mint); color: #000; border: none; padding: 7px 14px;
  border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); transition: var(--transition);
}
.share-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5); }

/* ---------------- LAYOUT ---------------- */
.main-container {
  max-width: 1200px; width: 100%; margin: 0 auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0;
}

/* ---------------- CUSTOMIZED PLYR PLAYER ---------------- */
.playerWrap {
  width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid var(--border-color); flex-shrink: 0;
}
.plyr { height: 100%; width: 100%; }
.plyr--video .plyr__controls { background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8)) !important; padding: 20px 10px 10px !important; }

/* ---------------- RESIZER ---------------- */
.resizer { height: 20px; width: 100%; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.6; }
.resizer-line { width: 50px; height: 5px; background: var(--border-color); border-radius: 10px; transition: var(--transition); }
.resizer:hover .resizer-line, .resizer:active .resizer-line { background: var(--accent-mint); }

/* ---------------- CHAT UI ---------------- */
.chatBox {
  flex: 1; min-height: 0; background: var(--bg-panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.chatHeader {
  background: rgba(255,255,255,0.03); padding: 14px 20px; font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
}

#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }

/* System Message */
.sys-msg { text-align: center; font-size: 12px; color: var(--accent-mint); font-weight: 500; margin: 4px 0; background: var(--accent-mint-dim); padding: 4px 12px; border-radius: 20px; align-self: center; }

/* Message Bubbles */
.msg { display: flex; width: 100%; align-items: flex-end; gap: 8px; animation: msgFade 0.3s forwards; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2a2a35; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; text-transform: uppercase; border: 1px solid var(--border-color); }
.msg-content { display: flex; flex-direction: column; max-width: 75%; }
.msgBox { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; position: relative; }
.msg-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 8px; }

/* Quotes / Replies */
.quote-block { background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent-mint); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; opacity: 0.9; }
.quote-name { font-weight: 700; margin-bottom: 2px; color: var(--accent-mint); }

.left { justify-content: flex-start; }
.left .msgBox { background: rgba(255,255,255,0.06); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

.right { justify-content: flex-end; flex-direction: row-reverse; }
.right .msgBox { background: var(--accent-mint); color: #000; border-bottom-right-radius: 4px; font-weight: 500; box-shadow: 0 4px 15px rgba(0,229,255,0.15); }
.right .msg-meta { justify-content: flex-end; }
.right .quote-block { border-left-color: #000; background: rgba(0,0,0,0.1); }
.right .quote-name { color: #000; }

.name { font-weight: 700; font-size: 12px; margin-bottom: 4px; opacity: 0.8; }
.right .name { display: none; } /* Hide own name */

.reply-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; opacity: 0; transition: var(--transition); display: flex; }
.msg:hover .reply-btn { opacity: 1; }
.reply-btn:hover { color: var(--accent-mint); transform: scale(1.1); }

.reply-preview { display: none; background: rgba(255,255,255,0.02); padding: 10px 16px; border-left: 3px solid var(--accent-mint); font-size: 13px; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); }
.reply-preview-text { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chatInput { display: flex; padding: 12px 16px; background: rgba(0, 0, 0, 0.4); border-top: 1px solid var(--border-color); gap: 12px; align-items: center; }
.chatInput input { flex: 1; padding: 14px 18px; border: 1px solid var(--border-color); border-radius: 30px; background: rgba(255,255,255,0.03); color: #fff; font-size: 14px; transition: var(--transition); }
.chatInput input:focus { border-color: var(--accent-mint); background: rgba(0,229,255,0.03); }

.send-btn { background: var(--accent-mint); border: none; color: #000; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,229,255,0.4); }

@keyframes msgFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseLive { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
</style>
</head>

<body>
<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="topbar-actions">
    <!-- LIVE USERS BADGE -->
    <div class="live-badge" id="liveCount" title="Active users on this page">
      <div class="live-dot"></div> Live (1)
    </div>
    <div class="room-badge" id="roomId"></div>
    <button class="share-btn" onclick="shareRoom()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> Share
    </button>
  </div>
</div>

<div class="main-container">
  <div class="playerWrap" id="playerContainer">
    <video id="player" controls playsinline></video>
  </div>

  <div class="resizer" id="resizer">
    <div class="resizer-line"></div>
  </div>

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <span>Live Chat Room</span>
      <span style="font-size: 11px; color: var(--accent-mint);">End-to-End Synced</span>
    </div>
    
    <div id="messages"></div>
    
    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-text">Replying to <strong id="replyName" style="color:#fff;"></strong>: <span id="replyText"></span></div>
      <div style="cursor:pointer; color:#ff4757; padding:4px;" onclick="cancelReply()">✕</div>
    </div>
    
    <div class="chatInput">
      <input id="msg" placeholder="Type your message..." autocomplete="off" onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMsg()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<!-- Note: Ensure set and onDisconnect are exported from firebase.js -->
<script type="module">
import { db, ref, onValue, push, onChildAdded, set, onDisconnect, remove } from "./firebase.js"

const params = new URLSearchParams(location.search);
const room = params.get("room") || "lobby";
document.getElementById("roomId").innerText = "#" + room;

const msgSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

// --- 1. USERNAME SETUP ---
let username = localStorage.getItem("asvm_name");
function askName() {
  let name = prompt("Enter your display name:");
  if (name && name.trim().toLowerCase() !== "asvm") {
    localStorage.setItem("asvm_name", name.trim());
    return name.trim();
  } else {
    alert("Invalid name or 'asvm' is reserved.");
    return askName();
  }
}
if(!username || username.toLowerCase() === "asvm") username = askName();


// --- 2. ADVANCED PLYR CONFIGURATION (Quality Enabled) ---
const video = document.getElementById("player");
let player = new Plyr(video, {
  settings: ['captions', 'quality', 'speed', 'loop'], // Added quality options
  youtube: { noCookie: false, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 },
  tooltips: { controls: true, seek: true }
});

let sourceLoaded = false;
onValue(ref(db,"rooms/"+room), snap => {
  const data = snap.val(); if(!data) return;
  const url = atob(data.src);
  if(sourceLoaded) return; sourceLoaded = true;

  if(url.includes("youtube.com") || url.includes("youtu.be")){
    const ytId = getYoutubeID(url);
    if(ytId) player.source = { type: 'video', sources: [{ src: ytId, provider: 'youtube' }] };
  } else if(url.includes(".m3u8")){
    if(Hls.isSupported()){ const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); }
  } else {
    player.source = { type:"video", sources:[{ src:url, type:"video/mp4" }] };
  }
});
function getYoutubeID(url){ let reg=/((youtu.be\/)|(v=))([^#&?]*)/; let match=url.match(reg); return(match&&match[4])?match[4]:null }


// --- 3. LIVE PRESENCE SYSTEM (Active Users) ---
// Note: Requires 'set' and 'onDisconnect' to be imported from firebase.js
const myPresenceRef = ref(db, `rooms/${room}/presence/${username}_${Date.now()}`);
const connectedRef = ref(db, ".info/connected");

onValue(connectedRef, (snap) => {
  if (snap.val() === true) {
    onDisconnect(myPresenceRef).remove().then(() => {
      set(myPresenceRef, { name: username, active: true });
    }).catch(e => console.log("Presence error (Check firebase exports):", e));
  }
});

onValue(ref(db, `rooms/${room}/presence`), (snap) => {
  const data = snap.val() || {};
  const activeCount = Object.keys(data).length;
  document.getElementById("liveCount").innerHTML = `<div class="live-dot"></div> Live (${activeCount})`;
});


// --- 4. ADVANCED CHAT SYSTEM ---
let messagesMap = {}; 
let replyingTo = null;
const msgInput = document.getElementById("msg");
const msgBoxEl = document.getElementById("messages");

function formatTime(ms) { return new Date(ms).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }
function getInitials(name) { return name.substring(0,2).toUpperCase(); }

function addSysMsg(text) {
  const div = document.createElement("div"); div.className = "sys-msg"; div.innerText = text;
  msgBoxEl.appendChild(div); msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
}
addSysMsg("Welcome to ASVM Premium Room");

// Join Notification
push(ref(db,"rooms/"+room+"/joins"),{ name:username, time:Date.now() });
onChildAdded(ref(db,"rooms/"+room+"/joins"), snap => {
  const j = snap.val(); if(j.name !== username) addSysMsg(`${j.name} joined the watch party`);
});

window.handleKeyPress = e => { if(e.key==="Enter") sendMsg() };
window.initReply = id => {
  const m = messagesMap[id]; if(!m) return;
  replyingTo = { id, name: m.name, text: m.text };
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyName").innerText = m.name;
  document.getElementById("replyText").innerText = m.text.substring(0, 40) + "...";
  msgInput.focus();
}
window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

window.sendMsg = () => {
  const text = msgInput.value.trim(); if(!text) return;
  push(ref(db,"rooms/"+room+"/chat"),{ name:username, text, time:Date.now(), reply: replyingTo });
  msgInput.value=""; cancelReply();
}

onChildAdded(ref(db,"rooms/"+room+"/chat"), snap => {
  const m = snap.val(); messagesMap[snap.key] = m;
  const div = document.createElement("div");
  const isMe = m.name === username;
  div.className = "msg " + (isMe ? "right" : "left");
  
  if(!isMe) msgSound.play().catch(e => {});

  let quoteHTML = m.reply ? `<div class="quote-block"><div class="quote-name">${m.reply.name}</div><div>${m.reply.text}</div></div>` : "";
  let avatarHTML = isMe ? "" : `<div class="msg-avatar">${getInitials(m.name)}</div>`;

  div.innerHTML=`
    ${avatarHTML}
    <div class="msg-content">
      <div class="msgBox">
        ${quoteHTML}
        <div class="name">${m.name}</div>
        ${m.text}
      </div>
      <div class="msg-meta">${formatTime(m.time)}</div>
    </div>
    <button class="reply-btn" onclick="initReply('${snap.key}')" title="Reply">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
    </button>
  `;
  msgBoxEl.appendChild(div);
  msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
});


// --- 5. RESIZER ---
const resizer = document.getElementById("resizer");
const playerContainer = document.getElementById("playerContainer");
const mainContainer = document.querySelector(".main-container");
let isResizing = false;
resizer.addEventListener("mousedown", initDrag); resizer.addEventListener("touchstart", initDrag, {passive: true});
function initDrag(e) { isResizing = true; document.documentElement.addEventListener("mousemove", doDrag); document.documentElement.addEventListener("touchmove", doDrag, {passive: false}); document.documentElement.addEventListener("mouseup", stopDrag); document.documentElement.addEventListener("touchend", stopDrag); }
function doDrag(e) { if (!isResizing) return; let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY; let newHeight = clientY - playerContainer.getBoundingClientRect().top; if (newHeight >= 150 && newHeight <= mainContainer.clientHeight - 150) playerContainer.style.height = newHeight + "px"; }
function stopDrag() { isResizing = false; }


// --- 6. SHARE ---
window.shareRoom = () => {
  const url = window.location.href;
  if (navigator.share) navigator.share({ title: 'Join my ASVM Room', url });
  else { navigator.clipboard.writeText(url); alert("Link copied to clipboard!"); }
}
</script>
</body>
</html>
