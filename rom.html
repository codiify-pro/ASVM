<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="description" content="ASVM is a free watch party platform to stream videos together with friends. Create rooms, sync playback, and chat live from any device.">

<meta name="keywords" content="ASVM, watch videos together, sync video online, watch movies together, online watch party, ASVM">

<meta name="author" content="ASVM">
  
  <meta property="og:title" content="ASVM – Watch Videos Together Online">
<meta property="og:description" content="Create a room and watch videos together with friends using ASVM watch party platform.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.asvm.fun">
<meta property="og:image" content="https://www.asvm.fun/preview.png">

<style>
/* Ultra-Modern SaaS Variables (Green/Mint Tone) */
* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}
*:focus {
  outline: none;
}
:root {
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.4);
  --bg-panel-hover: rgba(39, 39, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  
  --accent-mint: #00dc82; 
  --accent-mint-dim: rgba(0, 220, 130, 0.15);
  
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  
  /* Plyr Theme Override to match ASVM Mint */
  --plyr-color-main: #00dc82;
  --plyr-video-background: #000000;
}

/* App-like fixed layout */
body {
  margin: 0;
  background: var(--bg-base);
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  overflow: hidden; 
  height: 100dvh; 
  display: flex;
  flex-direction: column;
}

/* Ambient Background Glows */
.ambient-glow-1, .ambient-glow-2 {
  position: fixed; 
  border-radius: 50%;
  filter: blur(120px);
  z-index: -1;
  opacity: 0.3;
  pointer-events: none;
}
.ambient-glow-1 {
  top: -10%; left: -10%;
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, var(--accent-mint-dim), transparent 70%);
}
.ambient-glow-2 {
  bottom: -10%; right: -10%;
  width: 40vw; height: 40vw;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.1), transparent 70%); 
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar {
  background: rgba(5, 5, 5, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 0 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
  height: 64px; 
  flex-shrink: 0; 
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: white;
  text-decoration: none;
}
.logo span { color: var(--accent-mint); }

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.room-badge {
  background: var(--accent-mint-dim);
  color: var(--accent-mint);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(0, 220, 130, 0.2);
}

.share-btn {
  background: transparent;
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.share-btn:hover { background: rgba(255,255,255,0.05); }

/* ---------------- LAYOUT ---------------- */
.main-container {
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px; 
  flex: 1; 
  min-height: 0; 
}

/* ---------------- VIDEO PLAYER ---------------- */
.playerWrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  border: 1px solid var(--border-color);
  flex-shrink: 0; 
  position: relative;
}

.plyr { height: 100%; width: 100%; }

/* ---------------- DRAGGABLE SLIDER ---------------- */
.resizer {
  height: 12px;
  width: 100%;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.5;
  touch-action: none;
}
.resizer-line {
  width: 40px;
  height: 4px;
  background: var(--border-color);
  border-radius: 10px;
}
.resizer:hover .resizer-line { background: var(--accent-mint); }

/* ---------------- CHAT UI ---------------- */
.chatBox {
  width: 100%;
  flex: 1; 
  min-height: 0; 
  background: var(--bg-panel);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex; 
  flex-direction: column;
  overflow: hidden;
}

.chatHeader {
  background: rgba(255, 255, 255, 0.02);
  padding: 12px 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-color);
}

.live-dot {
  width: 8px;
  height: 8px;
  background: var(--accent-mint);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

#messages {
  flex: 1; 
  overflow-y: auto; 
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Message Bubbles */
.msg {
  display: flex;
  width: 100%;
  animation: messagePop 0.3s var(--transition) forwards;
}

.msgBox {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}

.left { justify-content: flex-start; }
.left .msgBox {
  background: var(--bg-panel-hover);
  color: var(--text-main);
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
}

.right { justify-content: flex-end; }
.right .msgBox {
  background: var(--accent-mint);
  color: #050505; 
  border-bottom-right-radius: 4px;
  font-weight: 500;
}

.name {
  font-weight: 700;
  font-size: 11px;
  margin-bottom: 3px;
  opacity: 0.7;
}
.right .name { color: rgba(0,0,0,0.5); }

/* Reply & Quote Styling */
.quote-block {
  background: rgba(0, 0, 0, 0.15);
  border-left: 3px solid var(--accent-mint);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 8px;
  opacity: 0.8;
}

.reply-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  opacity: 0.4;
  padding: 8px;
}
.reply-btn:hover { opacity: 1; color: var(--accent-mint); }
.right .reply-btn { order: -1; }

/* Input Area */
.chatInput {
  display: flex;
  padding: 12px;
  background: rgba(0, 0, 0, 0.2);
  border-top: 1px solid var(--border-color);
  gap: 10px;
  align-items: center;
}

.chatInput input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.03);
  color: var(--text-main);
  font-size: 14px;
}

.send-btn {
  background: var(--accent-mint);
  border: none;
  color: #050505;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Animations */
@keyframes messagePop {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 220, 130, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(0, 220, 130, 0); }
}

/* Specific Style for System/Welcome Message */
.system-msg .msgBox {
  border: 1px dashed var(--accent-mint);
  background: rgba(0, 220, 130, 0.05) !important;
}
</style>
</head>

<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="topbar">
  <a href="#" class="logo">ASVM<span>.</span></a>
  <div class="topbar-actions">
    <button class="share-btn" onclick="shareRoom()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Share
    </button>
    <div class="room-badge" id="roomId">Room: --</div>
  </div>
</div>

<div class="main-container">
  
  <div class="playerWrap" id="playerContainer">
    <video id="player" controls playsinline></video>
  </div>

  <div class="resizer" id="resizer">
    <div class="resizer-line"></div>
  </div>

  <div class="chatBox">
    <div class="chatHeader">
      <div class="live-dot"></div>
      <span>Room Chat</span>
    </div>

    <div id="messages"></div>

    <div class="chatInput">
      <input id="msg" placeholder="Type a message..." autocomplete="off">
      <button class="send-btn" onclick="sendMsg()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script type="module">
import {db,ref,onValue,push,onChildAdded} from "./firebase.js"

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
document.getElementById("roomId").innerText = "Room: " + room;

const video = document.getElementById("player");
let player = new Plyr(video);
const msgBoxEl = document.getElementById("messages");
const msgInput = document.getElementById("msg");

let messagesMap = {};
let username = localStorage.getItem("asvm_name") || "";

// Welcome Message Logic (As soon as page loads)
function addWelcomeMessage() {
    const welcomeId = "welcome-msg";
    const div = document.createElement("div");
    div.className = "msg left system-msg";
    div.innerHTML = `
        <div class="msgBox">
            <div class="name">ASVM</div>
            Hey! Welcome to ASVM Player
        </div>
    `;
    msgBoxEl.appendChild(div);
}

// Prompt Name if not exists
if(!username){
    username = prompt("Enter your name to join:") || "User" + Math.floor(Math.random()*1000);
    localStorage.setItem("asvm_name", username);
}

// Initial Welcome
addWelcomeMessage();

// Firebase Listeners
onValue(ref(db, "rooms/" + room), snap => {
    const data = snap.val();
    if(!data || !data.src) return;
    const url = atob(data.src);
    
    // Video Loader Logic
    if(url.includes("youtube.com") || url.includes("youtu.be")) {
        player.source = { type: 'video', sources: [{ src: url, provider: 'youtube' }] };
    } else if(url.includes(".m3u8")) {
        if(Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        }
    } else {
        player.source = { type: 'video', sources: [{ src: url, type: 'video/mp4' }] };
    }
}, { onlyOnce: true });

// Message Handler
window.sendMsg = function() {
    const text = msgInput.value.trim();
    if(!text) return;
    push(ref(db, "rooms/" + room + "/chat"), {
        name: username,
        text: text,
        time: Date.now()
    });
    msgInput.value = "";
}

msgInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMsg(); });

onChildAdded(ref(db, "rooms/" + room + "/chat"), snap => {
    const m = snap.val();
    const isMe = m.name === username;
    
    const div = document.createElement("div");
    div.className = `msg ${isMe ? 'right' : 'left'}`;
    div.innerHTML = `
        <div class="msgBox">
            <div class="name">${m.name}</div>
            ${m.text}
        </div>
    `;
    msgBoxEl.appendChild(div);
    msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
});

// Resize Logic
const resizer = document.getElementById("resizer");
const playerContainer = document.getElementById("playerContainer");
let isDragging = false;

resizer.addEventListener("mousedown", () => isDragging = true);
document.addEventListener("mousemove", (e) => {
    if(!isDragging) return;
    const newHeight = e.clientY - playerContainer.offsetTop;
    if(newHeight > 150 && newHeight < window.innerHeight * 0.7) {
        playerContainer.style.height = newHeight + "px";
        playerContainer.style.aspectRatio = "auto";
    }
});
document.addEventListener("mouseup", () => isDragging = false);

// Share Logic
window.shareRoom = () => {
    const url = window.location.href;
    navigator.clipboard.writeText(url);
    alert("Link copied!");
}

</script>
</body>
</html>
