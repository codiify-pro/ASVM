<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Secure Room Access</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<!-- ... (Keep all existing styles and imports from your previous script) ... -->
<style>
  /* PIN Modal Overlay */
  #pinOverlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.9); z-index: 5000;
    display: none; justify-content: center; align-items: center;
  }
  .pin-card {
    background: var(--bg-panel); border: 1px solid var(--border-color);
    padding: 30px; border-radius: 20px; text-align: center; width: 300px;
  }
  .pin-card input {
    width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px;
    background: #000; border: 1px solid #333; color: white; text-align: center;
    letter-spacing: 10px; font-size: 20px;
  }
</style>
</head>

<body>

<!-- PIN Entry Overlay -->
<div id="pinOverlay">
  <div class="pin-card">
    <h3>Private Room PIN</h3>
    <p style="font-size: 13px; color: var(--text-muted);">Enter 4-digit PIN to access</p>
    <input type="password" id="pinInput" maxlength="4" placeholder="••••">
    <button onclick="verifyPin()" style="background:var(--accent-mint); color:#000; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Enter Room</button>
  </div>
</div>

<!-- ... (Keep existing Topbar, Main Container, etc) ... -->

<script type="module">
import {db,ref,onValue} from "./firebase.js"

const params = new URLSearchParams(location.search);
const room = params.get("room");
let roomData = null;

onValue(ref(db, "rooms/" + room), (snap) => {
  roomData = snap.val();
  if (!roomData) return;

  // Check if it is a ComplexP room
  if (roomData.type === 'complexp') {
    document.getElementById('pinOverlay').style.display = 'flex';
  } else {
    initApp();
  }
});

window.verifyPin = function() {
  const enteredPin = document.getElementById('pinInput').value;
  if (enteredPin === roomData.pin) {
    document.getElementById('pinOverlay').style.display = 'none';
    initApp();
  } else {
    alert("Incorrect PIN!");
  }
}

function initApp() {
  // Move all your existing room loading logic inside here
  console.log("Access Granted. Initializing room...");
  // Example: video.src = atob(roomData.src);
}
</script>
</body>
</html>
