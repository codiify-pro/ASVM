<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">

<!-- Vidstack Player CSS (Modern Alternative to Plyr) -->
<link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
<link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Ultra-Modern SaaS Variables */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
:root {
  --bg-base: #030712;
  --bg-panel: rgba(17, 24, 39, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --accent-mint: #10b981; 
  --accent-mint-dim: rgba(16, 185, 129, 0.15);
  --accent-mint-hover: #059669;
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 10px;
  --transition: 0.3s ease;
}

body {
  background: var(--bg-base);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  overflow: hidden; 
  height: 100dvh; 
  display: flex;
  flex-direction: column;
}

/* Ambient Background Lights */
.ambient-glow-1, .ambient-glow-2 { position: fixed; border-radius: 50%; filter: blur(140px); z-index: -1; opacity: 0.4; pointer-events: none; }
.ambient-glow-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, var(--accent-mint-dim), transparent 70%); }
.ambient-glow-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar {
  background: rgba(3, 7, 18, 0.8);
  backdrop-filter: blur(20px);
  padding: 0 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
  height: 70px; 
  flex-shrink: 0; 
}
.logo { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
.logo span { color: var(--accent-mint); }

.topbar-actions { display: flex; align-items: center; gap: 16px; }

/* Live Count Badge */
.live-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #ef4444; padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
}
.live-dot {
  width: 8px; height: 8px; background: #ef4444; border-radius: 50%;
  box-shadow: 0 0 10px #ef4444; animation: pulseRed 2s infinite;
}

.room-badge { background: var(--accent-mint-dim); color: var(--accent-mint); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.share-btn { background: transparent; color: white; border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
.share-btn:hover { background: rgba(255,255,255,0.1); }

/* ---------------- MAIN LAYOUT ---------------- */
.app-layout {
  display: grid;
  grid-template-columns: 1fr 360px; /* Video left, Chat right */
  gap: 20px;
  padding: 20px 4%;
  flex: 1;
  min-height: 0;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

@media (max-width: 950px) {
  .app-layout { grid-template-columns: 1fr; grid-template-rows: min-content 1fr; padding: 15px; gap: 15px; }
  .live-badge span.text { display: none; } /* Hide text on mobile to save space */
}

/* ---------------- VIDEO PLAYER ---------------- */
.video-section {
  width: 100%;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  background: #000;
  display: flex;
  align-items: center;
  border: 1px solid var(--border-color);
}
media-player { width: 100%; aspect-ratio: 16/9; }

/* ---------------- CHAT UI ---------------- */
.chatBox {
  background: var(--bg-panel);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.chatHeader {
  background: rgba(255, 255, 255, 0.03); padding: 16px 20px; font-weight: 600;
  border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
}

#messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
}

/* Message Bubbles */
.msg { display: flex; width: 100%; align-items: flex-end; animation: slideUp 0.3s ease forwards; gap: 8px; }
.msgBox {
  max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; position: relative;
}
.name { font-weight: 700; font-size: 12px; margin-bottom: 4px; opacity: 0.7; }
.quote-block { background: rgba(0,0,0,0.2); border-left: 3px solid rgba(255,255,255,0.4); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; cursor: pointer; }

/* Left/Right Orientations */
.left { justify-content: flex-start; }
.left .msgBox { background: #1f2937; color: white; border-bottom-left-radius: 4px; }
.right { justify-content: flex-end; }
.right .msgBox { background: var(--accent-mint); color: #022c22; border-bottom-right-radius: 4px; font-weight: 500; }
.right .name { color: #064e3b; }

/* Reply Button */
.reply-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; opacity: 0; transition: 0.2s; padding: 4px; display: flex; align-items: center; }
.msg:hover .reply-btn { opacity: 1; }
.reply-btn:hover { color: var(--accent-mint); transform: scale(1.1); }
.right .reply-btn { order: -1; }

/* Chat Input Area */
.chatInputWrapper { background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; }
.typing-indicator { font-size: 12px; color: var(--accent-mint); padding: 8px 16px 0; font-style: italic; display: none; }
.chatInput { display: flex; padding: 12px; gap: 10px; align-items: center; }
.chatInput input { flex: 1; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); background: rgba(255,255,255,0.03); color: white; font-size: 14px; transition: 0.3s; }
.chatInput input:focus { border-color: var(--accent-mint); background: rgba(16,185,129,0.05); }

.action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; transition: 0.2s; display: flex; align-items: center; }
.action-btn:hover { color: white; }
.send-btn { background: var(--accent-mint); border: none; color: #022c22; width: 46px; height: 46px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.send-btn:hover { background: var(--accent-mint-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16,185,129,0.3); }

/* Reply Preview Panel */
.reply-preview { display: none; background: #1f2937; padding: 10px 16px; border-left: 3px solid var(--accent-mint); font-size: 13px; align-items: center; justify-content: space-between; }
.reply-preview-text { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
.cancel-reply { cursor: pointer; color: #ef4444; }

/* Toasts */
.toast-container { position: fixed; top: 90px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: rgba(17,24,39,0.9); backdrop-filter: blur(10px); border-left: 4px solid var(--accent-mint); padding: 14px 20px; border-radius: 8px; color: white; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
</style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>
<div class="toast-container" id="toastBox"></div>

<div class="topbar">
  <div class="logo">ASVM<span style="color:var(--accent-mint)">.</span></div>
  <div class="topbar-actions">
    <!-- Active User Status -->
    <div class="live-badge" title="Users currently active on this page">
      <div class="live-dot"></div>
      <span class="text">Live:</span> <span id="liveCount">1</span>
    </div>
    <div class="room-badge" id="roomId"></div>
    <button class="share-btn" onclick="shareRoom()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      <span class="text">Share</span>
    </button>
  </div>
</div>

<div class="app-layout">
  <!-- Vidstack Modern Player -->
  <div class="video-section">
    <media-player id="player" title="ASVM Stream" cross-origin plays-inline>
      <media-provider></media-provider>
      <media-video-layout></media-video-layout>
    </media-player>
  </div>

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <span>Room Chat</span>
    </div>
    
    <div id="messages"></div>

    <div class="chatInputWrapper">
      <!-- Typing Indicator -->
      <div id="typingDisplay" class="typing-indicator">Someone is typing...</div>
      
      <div class="reply-preview" id="replyPreview">
        <div class="reply-preview-text">Replying to <strong id="replyName"></strong>: <span id="replyText"></span></div>
        <div class="cancel-reply" onclick="cancelReply()">✕</div>
      </div>

      <div class="chatInput">
        <button class="action-btn" id="emojiButton">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        </button>
        <input id="msg" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" onclick="sendMsg()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts: Vidstack + Emoji -->
<script type="module" src="https://cdn.vidstack.io/player"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<script type="module">
// Standard imports from your firebase.js module
import {db, ref, set, push, update, onValue, onChildAdded} from "./firebase.js";

// CDN imports explicitly for Real-time Presence (Live Tracking) and deleting data
import { onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const params = new URLSearchParams(location.search);
const room = params.get("room") || "default";
document.getElementById("roomId").innerText = "#" + room;

const msgSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

// Name Logic
let username = localStorage.getItem("asvm_name");
function askName() {
  let name = prompt("Enter your name to join the room:");
  if (name) {
    if (name.trim().toLowerCase() === "asvm") {
      alert("Name 'asvm' is reserved. Choose another.");
      return askName();
    }
    localStorage.setItem("asvm_name", name.trim());
    return name.trim();
  }
  return "Anonymous " + Math.floor(Math.random() * 1000);
}
if(!username || username.toLowerCase() === "asvm") { username = askName(); }

// Toast Notification System
function showToast(text) {
  const box = document.getElementById("toastBox");
  const toast = document.createElement("div");
  toast.className = "toast"; toast.innerText = text;
  box.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=> toast.remove(), 300); }, 3000);
}

// ---------------- LIVE PRESENCE TRACKING ----------------
// Generate unique ID for this session
const sessionId = Math.random().toString(36).substring(2, 15);
const myPresenceRef = ref(db, `rooms/${room}/presence/${sessionId}`);

// Set user online
set(myPresenceRef, { name: username, active: true });
// Firebase handles disconnection automatically
onDisconnect(myPresenceRef).remove();

// Clean up if window closes normally
window.addEventListener("beforeunload", () => { remove(myPresenceRef); });

// Listen to Live Users Count
onValue(ref(db, `rooms/${room}/presence`), (snap) => {
  const data = snap.val();
  const count = data ? Object.keys(data).length : 0;
  document.getElementById("liveCount").innerText = count;
});

// Join Notification
push(ref(db, `rooms/${room}/joins`), { name: username, time: Date.now() });
let initialJoins = true;
onChildAdded(ref(db, `rooms/${room}/joins`), (snap) => {
  if (initialJoins) return; // prevent spam on reload
  const j = snap.val();
  if (j.name !== username) showToast(`👋 ${j.name} joined the room`);
});
setTimeout(() => initialJoins = false, 2000);

// ---------------- PLAYER LOGIC (Vidstack) ----------------
const player = document.getElementById("player");
let sourceLoaded = false;
onValue(ref(db, `rooms/${room}`), snap => {
  const data = snap.val(); if(!data) return;
  const url = atob(data.src);
  if(sourceLoaded) return; 
  sourceLoaded = true;
  // Vidstack is smart enough to handle YouTube URLs, M3U8, and MP4 out of the box!
  player.src = url;
});

// ---------------- CHAT & TYPING INDICATOR ----------------
const msgInput = document.getElementById("msg");
const msgBoxEl = document.getElementById("messages");
let messagesMap = {}; let replyingTo = null;

// Typing Indicator Logic
const typingRef = ref(db, `rooms/${room}/typing/${sessionId}`);
let typingTimeout;
msgInput.addEventListener('input', () => {
  set(typingRef, username);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => { remove(typingRef); }, 1500);
});

onValue(ref(db, `rooms/${room}/typing`), (snap) => {
  const data = snap.val();
  const typingDisplay = document.getElementById("typingDisplay");
  if (!data) { typingDisplay.style.display = 'none'; return; }
  
  const typists = Object.values(data).filter(name => name !== username);
  if (typists.length > 0) {
    let text = typists.slice(0, 2).join(", ");
    if (typists.length > 2) text += ` & ${typists.length - 2} others`;
    typingDisplay.innerText = text + (typists.length > 1 ? " are typing..." : " is typing...");
    typingDisplay.style.display = 'block';
  } else {
    typingDisplay.style.display = 'none';
  }
});

// Emoji setup
const picker = new EmojiButton({ theme: 'dark', position: 'top-start' });
picker.on('emoji', emoji => { msgInput.value += emoji; msgInput.focus(); });
document.getElementById('emojiButton').addEventListener('click', () => picker.togglePicker(document.getElementById('emojiButton')));

// Send Message Flow
msgInput.addEventListener('keypress', e => { if(e.key==="Enter") window.sendMsg() });
window.initReply = id => {
  const m = messagesMap[id]; if(!m) return;
  replyingTo = { id, name: m.name, text: m.text };
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyName").innerText = m.name;
  document.getElementById("replyText").innerText = m.text.substring(0, 30);
  msgInput.focus();
}
window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

window.sendMsg = () => {
  const text = msgInput.value.trim(); if(!text) return;
  push(ref(db, `rooms/${room}/chat`), { name: username, text, time: Date.now(), reply: replyingTo });
  msgInput.value = ""; cancelReply(); remove(typingRef); // clear typing
}

// Render Messages
function addWelcomeMessage() {
  const div = document.createElement("div");
  div.className = "msg left";
  div.innerHTML = `<div class="msgBox"><div class="name">ASVM System</div>Welcome to the newly upgraded ASVM Watch Party! 🚀</div>`;
  msgBoxEl.appendChild(div);
}
addWelcomeMessage();

onChildAdded(ref(db, `rooms/${room}/chat`), snap => {
  const m = snap.val(); messagesMap[snap.key] = m;
  const div = document.createElement("div");
  const isMe = m.name === username;
  div.className = "msg " + (isMe ? "right" : "left");
  
  if(!isMe) msgSound.play().catch(()=>{});

  let quoteHTML = m.reply ? `<div class="quote-block"><strong>${m.reply.name}</strong><br>${m.reply.text}</div>` : "";
  let replyBtn = `<button class="reply-btn" onclick="initReply('${snap.key}')" title="Reply"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg></button>`;

  div.innerHTML = `
    ${!isMe ? replyBtn : ''}
    <div class="msgBox">
      ${quoteHTML}
      <div class="name">${m.name}</div>
      ${m.text}
    </div>
    ${isMe ? replyBtn : ''}
  `;
  msgBoxEl.appendChild(div);
  msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
});

window.shareRoom = () => {
  const url = window.location.href;
  if (navigator.share) navigator.share({ title: 'ASVM Sync Room', url });
  else { navigator.clipboard.writeText(url); showToast("Link copied to clipboard!"); }
}
</script>
</body>
</html>
