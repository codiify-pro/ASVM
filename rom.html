<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="description" content="ASVM is a free watch party platform to stream videos together with friends. Create rooms, sync playback, and chat live from any device.">

<meta name="keywords" content="ASVM, watch videos together, sync video online, watch movies together, online watch party, ASVM">

<meta name="author" content="ASVM">
  
  <meta property="og:title" content="ASVM – Watch Videos Together Online">
<meta property="og:description" content="Create a room and watch videos together with friends using ASVM watch party platform.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.asvm.fun">
<meta property="og:image" content="https://www.asvm.fun/preview.png">

<style>
/* Ultra-Modern SaaS Variables (Green/Mint Tone) */
* {
  -webkit-tap-highlight-color: transparent;
}
*:focus {
  outline: none;
}
:root {
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.4);
  --bg-panel-hover: rgba(39, 39, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  
  --accent-mint: #00dc82; 
  --accent-mint-dim: rgba(0, 220, 130, 0.15);
  
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  
  --plyr-color-main: #00dc82;
  --plyr-video-background: #000000;
}

body {
  margin: 0;
  background: var(--bg-base);
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  overflow: hidden; 
  height: 100dvh; 
  display: flex;
  flex-direction: column;
}

.ambient-glow-1, .ambient-glow-2 {
  position: fixed; 
  border-radius: 50%;
  filter: blur(120px);
  z-index: -1;
  opacity: 0.3;
  pointer-events: none;
}
.ambient-glow-1 {
  top: -10%; left: -10%;
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, var(--accent-mint-dim), transparent 70%);
}
.ambient-glow-2 {
  bottom: -10%; right: -10%;
  width: 40vw; height: 40vw;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.1), transparent 70%); 
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar {
  background: rgba(5, 5, 5, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 0 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
  height: 64px; 
  flex-shrink: 0; 
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: white;
}
.logo span { color: var(--accent-mint); }

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.room-badge {
  background: var(--accent-mint-dim);
  color: var(--accent-mint);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(0, 220, 130, 0.2);
}

.share-btn {
  background: transparent;
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.share-btn:hover {
  background: rgba(255,255,255,0.05);
}

/* ---------------- LAYOUT ---------------- */
.main-container {
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
  padding: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 16px; 
  flex: 1; 
  min-height: 0; 
}

/* ---------------- VIDEO PLAYER ---------------- */
.playerWrap {
  width: 100%;
  aspect-ratio: 16 / 9; 
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  border: 1px solid var(--border-color);
  flex-shrink: 0; 
  position: relative;
  display: flex;
  flex-direction: column;
}

.plyr {
  width: 100%;
  height: 100%;
  flex: 1;
}

/* ---------------- DRAGGABLE SLIDER (RESIZER) ---------------- */
.resizer {
  height: 24px;
  width: 100%;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.6;
  transition: opacity 0.2s, background 0.2s;
  margin: 4px 0;
  border-radius: 12px;
  touch-action: none; 
}

.resizer:hover, .resizer:active {
  opacity: 1;
  background: rgba(255, 255, 255, 0.05);
}

.resizer-line {
  width: 40px;
  height: 5px;
  background: var(--text-muted);
  border-radius: 10px;
  transition: background 0.2s;
}

.resizer:hover .resizer-line, .resizer:active .resizer-line {
  background: var(--accent-mint);
  box-shadow: 0 0 10px var(--accent-mint);
}

/* ---------------- CHAT UI ---------------- */
.chatBox {
  width: 100%;
  flex: 1; 
  min-height: 0; 
  background: var(--bg-panel);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex; 
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  position: relative;
}

.chatHeader {
  background: rgba(255, 255, 255, 0.02);
  padding: 14px 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}

.live-dot {
  width: 8px;
  height: 8px;
  background: var(--accent-mint);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-mint);
  animation: pulse 2s infinite;
}

#messages {
  flex: 1; 
  overflow-y: auto; 
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* Message Bubbles */
.msg {
  display: flex;
  width: 100%;
  align-items: center;
  animation: messagePop 0.3s var(--transition) forwards;
}

.msgBox {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
  transition: box-shadow 0.3s ease;
}

.quote-block {
  background: rgba(0, 0, 0, 0.25);
  border-left: 3px solid rgba(255,255,255,0.5);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  opacity: 0.85;
  transition: opacity 0.2s;
}
.quote-block:hover { opacity: 1; }
.quote-name { font-weight: 700; margin-bottom: 2px; }

.left { justify-content: flex-start; }
.left .msgBox {
  background: var(--bg-panel-hover);
  color: var(--text-main);
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
}
.left .quote-block { border-left-color: var(--accent-mint); }

.right { justify-content: flex-end; }
.right .msgBox {
  background: var(--accent-mint);
  color: #050505; 
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 15px rgba(0, 220, 130, 0.2);
  font-weight: 500;
}
.right .quote-block { border-left-color: #050505; background: rgba(0,0,0,0.1); }

.name {
  font-weight: 700;
  font-size: 12px;
  margin-bottom: 4px;
  opacity: 0.8;
  letter-spacing: 0.02em;
}

.right .name { color: rgba(0,0,0,0.6); }

.reply-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  opacity: 0.5;
  padding: 8px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
}
.reply-btn:hover { opacity: 1; color: var(--accent-mint); transform: scale(1.1); }
.left .reply-btn { margin-left: 5px; }
.right .reply-btn { margin-right: 5px; order: -1; }

.reply-preview {
  display: none;
  background: var(--bg-panel-hover);
  padding: 10px 16px;
  border-left: 3px solid var(--accent-mint);
  font-size: 13px;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border-color);
  flex-shrink: 0;
}
.reply-preview-text { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
.reply-preview-text strong { color: var(--text-main); }
.cancel-reply { 
  cursor: pointer; 
  color: var(--accent-rose); 
  display: flex; 
  align-items: center; 
  padding: 4px; 
}

.chatInput {
  display: flex;
  padding: 12px;
  background: rgba(0, 0, 0, 0.2);
  border-top: 1px solid var(--border-color);
  gap: 10px;
  flex-shrink: 0;
  align-items: center;
}

.emoji-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.emoji-btn:hover {
  color: var(--text-main);
}

.chatInput input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.03);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  transition: border-color var(--transition);
}

.chatInput input:focus {
  outline: none;
  border-color: var(--accent-mint);
  background: rgba(0, 220, 130, 0.02);
}

.chatInput button.send-btn {
  background: var(--accent-mint);
  border: none;
  color: #050505;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
}

.chatInput button.send-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 220, 130, 0.3);
}

.new-msg-dot {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-mint);
  color: #000;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 15px rgba(0, 220, 130, 0.4);
  z-index: 10;
  animation: fadeUp 0.3s forwards;
}

.popup {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-panel);
  backdrop-filter: blur(20px);
  border: 1px solid var(--accent-mint);
  color: var(--accent-mint);
  padding: 12px 24px;
  border-radius: 30px;
  display: none;
  font-weight: 600;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0, 220, 130, 0.15);
  z-index: 1000;
  animation: slideDown 0.4s var(--transition) forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes messagePop {
  from { opacity: 0; transform: translateY(10px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes slideDown {
  0% { opacity: 0; transform: translate(-50%, -20px); }
  100% { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 220, 130, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 220, 130, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 220, 130, 0); }
}
</style>
</head>

<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="topbar-actions">
    <button class="share-btn" onclick="shareRoom()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Share
    </button>
    <div class="room-badge" id="roomId"></div>
  </div>
</div>

<div class="main-container">
  <div class="playerWrap" id="playerContainer">
    <video id="player" controls playsinline></video>
  </div>

  <div class="resizer" id="resizer" title="Drag to resize">
    <div class="resizer-line"></div>
  </div>

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <div class="live-dot"></div>
      <span>Room Chat</span>
    </div>
    <div id="messages"></div>
    <div class="new-msg-dot" id="newMsgDot" onclick="scrollToBottom()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      New Messages
    </div>
    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-text">Replying to <strong id="replyName"></strong>: <span id="replyText"></span></div>
      <div class="cancel-reply" onclick="cancelReply()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
    </div>
    <div class="chatInput">
      <button class="emoji-btn" id="emojiButton"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg></button>
      <input id="msg" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMsg()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
    </div>
  </div>
</div>

<div class="popup" id="joinPopup"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<script type="module">
import {db,ref,onValue,push,onChildAdded} from "./firebase.js"

const params=new URLSearchParams(location.search)
const room=params.get("room")
document.getElementById("roomId").innerText="Room: "+room

const video=document.getElementById("player")
let player=new Plyr(video)
const msgSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

let username=localStorage.getItem("asvm_name")

// --- NAME RESTRICTION LOGIC ---
function askName() {
  let name = prompt("Enter your name to join the room:");
  if (name) {
    let cleanName = name.trim().toLowerCase();
    if (cleanName === "asvm") {
      alert("Sorry, the name 'asvm' is reserved for system. Please choose another name.");
      return askName(); // Recursive call until a valid name is entered
    }
    localStorage.setItem("asvm_name", name.trim());
    return name.trim();
  }
  return "Anonymous";
}

if(!username || username.toLowerCase() === "asvm"){
  username = askName();
}

/* User Join Notification */
push(ref(db,"rooms/"+room+"/joins"),{ name:username, time:Date.now() })
onChildAdded(ref(db,"rooms/"+room+"/joins"),(snap)=>{
  const j=snap.val()
  if(j.name!==username) showPopup(j.name+" joined the room")
})

function showPopup(text){
  const p=document.getElementById("joinPopup"); p.innerText=text; p.style.display="block";
  setTimeout(()=>{ p.style.display="none" },3000)
}

/* Load Video Logic */
let sourceLoaded = false;
onValue(ref(db,"rooms/"+room),snap=>{
  const data=snap.val(); if(!data) return;
  const url=atob(data.src);
  if(sourceLoaded) return; sourceLoaded=true;

  if(url.includes("youtube.com") || url.includes("youtu.be")){
    const ytId = getYoutubeID(url);
    if(ytId) player.source = { type: 'video', sources: [{ src: ytId, provider: 'youtube' }] };
  } else if(url.includes(".m3u8")){
    if(Hls.isSupported()){ const hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); }
  } else {
    player.source={ type:"video", sources:[{ src:url, type:"video/mp4" }] }
  }
})

function getYoutubeID(url){ let reg=/((youtu.be\/)|(v=))([^#&?]*)/; let match=url.match(reg); return(match&&match[4])?match[4]:null }

/* Resizer Logic */
const resizer = document.getElementById("resizer");
const playerContainer = document.getElementById("playerContainer");
const mainContainer = document.querySelector(".main-container");
let isResizing = false;

resizer.addEventListener("mousedown", initDrag);
resizer.addEventListener("touchstart", initDrag);

function initDrag(e) {
  isResizing = true;
  document.documentElement.addEventListener("mousemove", doDrag);
  document.documentElement.addEventListener("touchmove", doDrag);
  document.documentElement.addEventListener("mouseup", stopDrag);
  document.documentElement.addEventListener("touchend", stopDrag);
}

function doDrag(e) {
  if (!isResizing) return;
  let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
  let newHeight = clientY - playerContainer.getBoundingClientRect().top;
  if (newHeight >= 100 && newHeight <= mainContainer.clientHeight - 200) {
    playerContainer.style.height = newHeight + "px";
  }
}

function stopDrag() { isResizing = false; }

/* Chat Logic */
let messagesMap = {}; 
let replyingTo = null;
const msgInput = document.getElementById("msg");
const msgBoxEl = document.getElementById("messages");

// --- SYSTEM WELCOME MESSAGE (Same style as normal chat) ---
function addWelcomeMessage() {
  const div = document.createElement("div");
  div.className = "msg left";
  div.innerHTML = `
    <div class="msgBox">
      <div class="name">asvm</div>
      Welcome to asvm player
    </div>
  `;
  msgBoxEl.appendChild(div);
}
addWelcomeMessage();

const picker = new EmojiButton({ theme: 'dark', position: 'top-start' });
picker.on('emoji', emoji => { msgInput.value += emoji; msgInput.focus(); });
document.getElementById('emojiButton').addEventListener('click', () => picker.togglePicker(document.getElementById('emojiButton')));

window.handleKeyPress = e => { if(e.key==="Enter") sendMsg() };
window.initReply = id => {
  const m = messagesMap[id]; if(!m) return;
  replyingTo = { id, name: m.name, text: m.text };
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyName").innerText = m.name;
  document.getElementById("replyText").innerText = m.text.substring(0, 30);
  msgInput.focus();
}
window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

window.sendMsg = () => {
  const text=msgInput.value; if(!text) return;
  push(ref(db,"rooms/"+room+"/chat"),{ name:username, text, time:Date.now(), reply: replyingTo });
  msgInput.value=""; cancelReply();
}

window.scrollToBottom = () => { msgBoxEl.scrollTop = msgBoxEl.scrollHeight; document.getElementById("newMsgDot").style.display = "none"; }

onChildAdded(ref(db,"rooms/"+room+"/chat"),snap=>{
  const m=snap.val(); messagesMap[snap.key] = m;
  const div=document.createElement("div");
  const isMe = m.name===username;
  div.className="msg "+(isMe?"right":"left");
  
  if(!isMe) msgSound.play().catch(e => {});

  let quoteHTML = m.reply ? `<div class="quote-block"><div class="quote-name">${m.reply.name}</div><div>${m.reply.text}</div></div>` : "";

  div.innerHTML=`
    <div class="msgBox">
      ${quoteHTML}
      <div class="name">${m.name}</div>
      ${m.text}
    </div>
    <button class="reply-btn" onclick="initReply('${snap.key}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
    </button>
  `;
  msgBoxEl.appendChild(div);
  msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
})

window.shareRoom = () => {
  const url = window.location.href;
  if (navigator.share) navigator.share({ title: 'ASVM', url });
  else { navigator.clipboard.writeText(url); showPopup("Link copied!"); }
}
</script>
</body>
</html>
