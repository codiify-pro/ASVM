<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room v2.0</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="description" content="ASVM v2.0 - Premium watch party platform.">

<style>
/* Modernized SaaS Variables */
:root {
  --bg-base: #020202;
  --bg-panel: rgba(20, 20, 22, 0.6);
  --bg-panel-hover: rgba(35, 35, 38, 0.7);
  --border-color: rgba(255, 255, 255, 0.06);
  --text-main: #ffffff;
  --text-muted: #94a3b8;
  --accent-mint: #00f593; 
  --accent-mint-dim: rgba(0, 245, 147, 0.1);
  --radius-xl: 28px;
  --radius-lg: 18px;
  --radius-md: 12px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --plyr-color-main: #00f593;
}

* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-base);
  font-family: 'Inter', sans-serif; color: var(--text-main);
  overflow: hidden; height: 100dvh; display: flex; flex-direction: column;
}

/* Ambient BG */
.ambient-glow {
  position: fixed; width: 60vw; height: 60vw; border-radius: 50%;
  filter: blur(140px); z-index: -1; opacity: 0.15; pointer-events: none;
}
.glow-1 { top: -20%; left: -10%; background: var(--accent-mint); }

/* Topbar */
.topbar {
  height: 68px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border-color); z-index: 100;
}
.logo { font-size: 24px; font-weight: 800; }
.logo span { color: var(--accent-mint); }

/* Main Layout */
.main-container {
  max-width: 1100px; width: 100%; margin: 0 auto; padding: 15px;
  display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 12px;
}

.playerWrap {
  width: 100%; aspect-ratio: 16/9; background: #000;
  border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border-color); flex-shrink: 0;
}

/* Resizer */
.resizer {
  height: 12px; cursor: ns-resize; display: flex; align-items: center; justify-content: center;
}
.resizer-line { width: 50px; height: 4px; background: #333; border-radius: 10px; }

/* Chat Box */
.chatBox {
  flex: 1; min-height: 0; background: var(--bg-panel);
  backdrop-filter: blur(20px); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); display: flex; flex-direction: column;
  position: relative;
}
.chatHeader {
  padding: 15px 20px; border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: 10px; font-weight: 600;
}
.live-dot { width: 8px; height: 8px; background: var(--accent-mint); border-radius: 50%; box-shadow: 0 0 10px var(--accent-mint); }

#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

/* Message Styling */
.msg { display: flex; width: 100%; animation: msgIn 0.3s ease-out; }
.msgBox { max-width: 80%; padding: 12px 16px; border-radius: 18px; position: relative; font-size: 14px; }
.left { justify-content: flex-start; }
.left .msgBox { background: var(--bg-panel-hover); border: 1px solid var(--border-color); }
.right { justify-content: flex-end; }
.right .msgBox { background: var(--accent-mint); color: #000; font-weight: 500; border-bottom-right-radius: 4px; }

.name { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; }

/* Input Area */
.chatInput {
  padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-color);
  display: flex; gap: 10px; align-items: center;
}
.chatInput input {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
  padding: 12px 18px; border-radius: 30px; color: #fff; font-family: inherit;
}
.chatInput input:focus { border-color: var(--accent-mint); outline: none; }
.send-btn {
  background: var(--accent-mint); border: none; width: 45px; height: 45px;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
}

@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Badge & Utility */
.room-badge { background: var(--accent-mint-dim); color: var(--accent-mint); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; }
</style>
</head>

<body>
<div class="ambient-glow glow-1"></div>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="room-badge" id="roomId">Room: Loading...</div>
</div>

<div class="main-container">
  <div class="playerWrap" id="playerContainer">
    <video id="player" controls playsinline></video>
  </div>

  <div class="resizer" id="resizer"><div class="resizer-line"></div></div>

  <div class="chatBox">
    <div class="chatHeader"><div class="live-dot"></div><span>Room Chat</span></div>
    <div id="messages">
        <div class="msg right">
            <div class="msgBox">
                <div class="name">ASVM</div>
                Hey! Welcome to ASVM Player 👋
            </div>
        </div>
    </div>
    
    <div class="chatInput">
      <input id="msg" placeholder="Write something..." autocomplete="off">
      <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script type="module">
import {db,ref,onValue,push,onChildAdded} from "./firebase.js"

const params = new URLSearchParams(location.search);
const room = params.get("room") || "Global";
document.getElementById("roomId").innerText = "Room: " + room;

const video = document.getElementById("player");
let player = new Plyr(video);
let sourceLoaded = false;
let username = localStorage.getItem("asvm_name") || prompt("Enter name:") || "Guest";
localStorage.setItem("asvm_name", username);

const msgInput = document.getElementById("msg");
const msgContainer = document.getElementById("messages");

// Send Message Function
window.sendMsg = () => {
    const text = msgInput.value.trim();
    if(!text) return;
    push(ref(db, "rooms/" + room + "/chat"), {
        name: username,
        text: text,
        time: Date.now()
    });
    msgInput.value = "";
};

document.getElementById("sendBtn").onclick = sendMsg;
msgInput.onkeypress = (e) => { if(e.key === "Enter") sendMsg(); };

// Load Messages
onChildAdded(ref(db, "rooms/" + room + "/chat"), (snap) => {
    const m = snap.val();
    const div = document.createElement("div");
    const isMe = m.name === username;
    div.className = "msg " + (isMe ? "right" : "left");
    div.innerHTML = `
        <div class="msgBox">
            <div class="name">${m.name}</div>
            ${m.text}
        </div>
    `;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
});

// Resizer Logic (Modified for Version Upgrade)
const resizer = document.getElementById("resizer");
const playerCont = document.getElementById("playerContainer");
resizer.onmousedown = (e) => {
    document.onmousemove = (e) => {
        let h = e.clientY - 100;
        if(h > 150 && h < 500) playerCont.style.height = h + "px";
    };
    document.onmouseup = () => document.onmousemove = null;
};

// Video Sync Data (Existing)
onValue(ref(db, "rooms/" + room), snap => {
    const data = snap.val();
    if(!data || sourceLoaded) return;
    const url = atob(data.src);
    sourceLoaded = true;
    if(url.includes(".m3u8")) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        player.source = { type: 'video', sources: [{ src: url }] };
    }
});
</script>
</body>
</html>
