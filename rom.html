<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<meta name="description" content="ASVM is a free watch party platform to stream videos together with friends.">
<meta name="keywords" content="ASVM, watch videos together, sync video online, watch movies together">
<meta name="author" content="ASVM">
<meta property="og:title" content="ASVM – Watch Videos Together Online">
<meta property="og:description" content="Create a room and watch videos together with friends using ASVM watch party platform.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.asvm.fun">
<meta property="og:image" content="https://www.asvm.fun/preview.png">

<style>
/* ---------------- CSS VARIABLES & THEMES ---------------- */
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
*:focus { outline: none; }

:root {
  /* Default Dark Mode */
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.4);
  --bg-panel-hover: rgba(39, 39, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  
  /* Dynamic Accent Color (Default AS Cinemaa Red) */
  --accent-main: #e50914; 
  --accent-dim: rgba(229, 9, 20, 0.15);
  --accent-text: #ffffff; 
  --gold: #d4af37;
  
  --radius-xl: 24px; --radius-lg: 16px; --radius-md: 12px;
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  --plyr-color-main: var(--accent-main);
  --plyr-video-background: #000000;
}

[data-theme="light"] {
  --bg-base: #f3f4f6;
  --bg-panel: #ffffff;
  --bg-panel-hover: #f9fafb;
  --border-color: #e5e7eb;
  --text-main: #111827;
  --text-muted: #6b7280;
  --accent-text: #ffffff;
  --plyr-video-background: #000000;
}

body {
  margin: 0; background: var(--bg-base); font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  color: var(--text-main); -webkit-font-smoothing: antialiased; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; transition: background 0.3s;
}

.ambient-glow-1, .ambient-glow-2 { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3; pointer-events: none; }
.ambient-glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--accent-dim), transparent 70%); }
.ambient-glow-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(212, 175, 55, 0.1), transparent 70%); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

/* ---------------- TOPBAR ---------------- */
.topbar { background: var(--bg-panel); backdrop-filter: blur(20px); padding: 0 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 1000; height: 64px; flex-shrink: 0; }
.logo { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-main), var(--gold)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px var(--accent-dim); }
.logo-mark svg { width: 18px; height: 18px; color: #fff; }
.logo span { color: var(--accent-main); transition: color 0.3s; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { background: var(--bg-panel-hover); border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); width: 40px; height: 40px; border-radius: 12px; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { color: var(--accent-text); background: var(--accent-main); border-color: var(--accent-main); transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-dim); }

/* ---------------- SIDEBAR ---------------- */
.sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
.sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background: var(--bg-panel); backdrop-filter: blur(25px); border-left: 1px solid var(--border-color); z-index: 2001; transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; padding: 20px 0; box-shadow: -5px 0 30px rgba(0,0,0,0.3); }
.sidebar-header { padding: 0 20px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header button { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; }
.sidebar-header button svg { width: 24px; height: 24px; }
.sidebar-menu { display: flex; flex-direction: column; padding: 10px 12px; gap: 4px; }
.sidebar-menu button { background: transparent; border: none; color: var(--text-main); padding: 12px; text-align: left; font-size: 14.5px; font-weight: 500; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 12px; border-radius: 12px; }
.sidebar-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--bg-panel-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition); }
.sidebar-menu button svg { width: 16px; height: 16px; opacity: 0.85; }
.sidebar-menu button:hover { background: var(--accent-dim); color: var(--accent-main); }
.sidebar-menu button:hover .sidebar-icon { background: var(--accent-main); }
.sidebar-menu button:hover .sidebar-icon svg { opacity: 1; stroke: var(--accent-text); color: var(--accent-text); }
.sidebar-menu button.danger:hover { background: rgba(255,68,68,0.12); color: #ff4444; }
.sidebar-menu button.danger:hover .sidebar-icon { background: #ff4444; }

/* ---------------- LAYOUT ---------------- */
.main-container { max-width: 1000px; width: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }

/* ---------------- VIDEO PLAYER ---------------- */
.playerWrap { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid var(--border-color); flex-shrink: 0; position: relative; display: flex; flex-direction: column; }
#ytWrapper, #plyrWrapper { width: 100%; height: 100%; flex: 1; }
.plyr { width: 100%; height: 100%; }
.resizer { height: 22px; width: 100%; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.7; transition: 0.2s; touch-action: none; gap: 6px; }
.resizer-line { width: 28px; height: 3px; background: var(--text-muted); border-radius: 10px; transition: 0.2s; }
.resizer:hover .resizer-line { background: var(--accent-main); box-shadow: 0 0 10px var(--accent-main); }

/* ---------------- CHAT UI ---------------- */
.chatBox { width: 100%; flex: 1; min-height: 0; background: var(--bg-panel); backdrop-filter: blur(24px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.chatHeader { background: rgba(0,0,0,0.05); padding: 12px 18px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.live-badge { display: flex; align-items: center; gap: 6px; background: var(--accent-dim); color: var(--accent-main); padding: 4px 10px 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
.live-dot { width: 6px; height: 6px; background: var(--accent-main); border-radius: 50%; box-shadow: 0 0 8px var(--accent-main); animation: pulse 2s infinite; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }

.msg { display: flex; flex-direction: column; width: 100%; animation: messagePop 0.3s forwards; }
.msg-content-wrapper { display: flex; align-items: center; width: 100%; gap: 5px; }
.msgBox { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; position: relative; }
.msg-timestamp { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

.left .msg-content-wrapper { justify-content: flex-start; }
.left .msgBox { background: var(--bg-panel-hover); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
.left .msg-timestamp { margin-left: 2px; text-align: left; }

.right .msg-content-wrapper { justify-content: flex-end; }
.right .msgBox { background: var(--accent-main); color: var(--accent-text); border-bottom-right-radius: 4px; box-shadow: 0 4px 15px var(--accent-dim); font-weight: 500; }
.right .name { color: rgba(0,0,0,0.6); }
.right .msg-timestamp { margin-right: 2px; text-align: right; }

.quote-block { background: rgba(0, 0, 0, 0.15); border-left: 3px solid rgba(255,255,255,0.5); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; cursor: pointer; }
.quote-name { font-weight: 700; margin-bottom: 2px; }
.left .quote-block { border-left-color: var(--accent-main); }
.right .quote-block { border-left-color: var(--accent-text); }

.name { font-weight: 700; font-size: 12px; margin-bottom: 4px; opacity: 0.8; }
.reply-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; opacity: 0.5; padding: 6px; transition: 0.2s; display: flex; align-items: center; }
.reply-btn svg { width: 16px; height: 16px; }
.reply-btn:hover { opacity: 1; color: var(--accent-main); }
.right .reply-btn { order: -1; }

.reply-preview { display: none; background: var(--bg-panel-hover); padding: 10px 16px; border-left: 3px solid var(--accent-main); font-size: 13px; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); }
.cancel-reply { cursor: pointer; color: #ff4444; display: flex; align-items: center; }
.cancel-reply svg { width: 18px; height: 18px; }

.chatInput { display: flex; padding: 12px; background: rgba(0, 0, 0, 0.05); border-top: 1px solid var(--border-color); gap: 8px; align-items: center; flex-shrink: 0; }
.chatInput input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 22px; background: var(--bg-panel-hover); color: var(--text-main); font-size: 14px; }
.chatInput input:focus { border-color: var(--accent-main); }
.send-btn { background: linear-gradient(135deg, var(--accent-main), var(--gold)); color: var(--accent-text); border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px var(--accent-dim); transition: var(--transition); }
.send-btn:hover { transform: scale(1.08); }
.send-btn svg { width: 18px; height: 18px; }
.emoji-btn { background: var(--bg-panel-hover); border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 50%; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition); }
.emoji-btn svg { width: 20px; height: 20px; transition: color 0.2s; }
.emoji-btn:hover { color: var(--accent-main); border-color: var(--accent-main); }

/* ---------------- CUSTOM MODALS (For Change ID, Themes, Actions) ---------------- */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.modal-box { background: var(--bg-panel); backdrop-filter: blur(25px); border: 1px solid var(--border-color); padding: 28px 24px 24px; border-radius: var(--radius-lg); width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; position: relative; overflow: hidden; }
.modal-box::before { content:''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-main), var(--gold)); }
.modal-box h3 { margin: 0 0 18px; color: var(--text-main); font-size: 17px; font-weight: 700; }
.modal-box input { width: 100%; padding: 13px 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-panel-hover); color: var(--text-main); font-size: 15px; }
.modal-box button { padding: 11px 22px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; margin: 5px; font-size: 13.5px; transition: var(--transition); }
.btn-primary { background: var(--accent-main); color: var(--accent-text); }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
.btn-cancel:hover { background: var(--bg-panel-hover); }

/* Theme Preview Strip */
.theme-preview { display: flex; align-items: center; gap: 10px; background: var(--bg-panel-hover); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; text-align: left; }
.theme-preview-dot { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-main), var(--gold, var(--accent-main))); flex-shrink: 0; box-shadow: 0 3px 10px var(--accent-dim); transition: var(--transition); }
.theme-preview-text { flex: 1; }
.theme-preview-label { font-size: 12.5px; font-weight: 700; color: var(--text-main); }
.theme-preview-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.theme-preview-chip { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 20px; background: var(--accent-main); color: var(--accent-text); transition: var(--transition); }

/* Theme Color Swatches */
.color-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 6px; margin-bottom: 18px; }
.color-swatch { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
.color-circle { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1), 0 3px 8px rgba(0,0,0,0.18); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s; position: relative; display: flex; align-items: center; justify-content: center; }
.color-swatch:hover .color-circle { transform: scale(1.14) translateY(-2px); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.28); }
.color-circle.active { transform: scale(1.1); box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px currentColor, 0 4px 12px rgba(0,0,0,0.25); }
.color-circle.active svg { width: 14px; height: 14px; }
.color-label { font-size: 9.5px; color: var(--text-muted); font-weight: 600; text-align: center; line-height: 1.2; opacity: 0.85; }

#recentActionsList { max-height: 250px; overflow-y: auto; text-align: left; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.action-item { padding: 8px; background: rgba(0,0,0,0.1); border-radius: 6px; border-left: 3px solid var(--accent-main); }

@keyframes messagePop { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-dim); } 70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
</style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<!-- Custom Modals -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box" id="modalContent"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    Menu 
    <button onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <div class="sidebar-menu">
    <button onclick="shareRoom()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v14"></path></svg></span>
      Share Room
    </button>
    <button onclick="openChangeId()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span>
      Change Room ID
    </button>
    <button class="danger" onclick="openDeleteId()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><path d="M10 11v6M14 11v6"></path></svg></span>
      Delete Current ID
    </button>
    <button onclick="openRecentActions()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"></path><path d="M3 4v5h5"></path><path d="M12 8v4l3 2"></path></svg></span>
      Recent Actions
    </button>
    <button onclick="openThemePicker()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="18.5" cy="10.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="6.5" cy="13.5" r="1.2" fill="currentColor" stroke="none"></circle><path d="M12 2a10 10 0 1 0 0 20c1.5 0 2-.9 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a3 3 0 0 0 3-3c0-5-3.6-9-8-9z"></path></svg></span>
      Theme & Colors
    </button>
    <button class="danger" onclick="clearChatUI()">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v2"></path><path d="M4 8h16l-1 12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1L4 8z"></path><path d="M9.5 3.5h5"></path></svg></span>
      Clear Chat Screen
    </button>
  </div>
</div>

<div class="topbar">
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"></path></svg>
    </span>
    ASVM<span>.</span>
  </div>
  <div class="topbar-actions">
    <!-- Dark/Light Mode SVG -->
    <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a1 1 0 0 1 0 18 9 9 0 0 1 0-18z" fill="none"></path><path d="M12 3v18"></path></svg>
    </button>
    <!-- Hamburger Menu SVG -->
    <button class="icon-btn" onclick="toggleSidebar()" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="16" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
  </div>
</div>

<div class="main-container">
  <div class="playerWrap" id="playerContainer">
    <!-- YT NATIVE PLAYER -->
    <div id="ytWrapper" style="display:none;">
      <div id="ytPlayerDiv"></div>
    </div>
    <!-- PLYR PLAYER -->
    <div id="plyrWrapper" style="display:none;">
      <video id="player" controls playsinline></video>
    </div>
  </div>

  <div class="resizer" id="resizer">
    <div class="resizer-line"></div>
  </div>

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span> Room Chat
    </div>

    <div id="messages"></div>
    
    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-text">Replying to <strong id="replyName"></strong>: <span id="replyText"></span></div>
      <div class="cancel-reply" onclick="cancelReply()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
    </div>

    <div class="chatInput">
      <!-- Emoji Box SVG -->
      <button class="emoji-btn" id="emojiButton">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 13.5c.8 1.2 2 2 3.5 2s2.7-.8 3.5-2"></path><circle cx="9" cy="9.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="9.5" r="1" fill="currentColor" stroke="none"></circle></svg>
      </button>
      <input id="msg" placeholder="Type a message..." autocomplete="off">
      <button class="send-btn" onclick="sendMsg()">
        <!-- Send Message SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L20 4l-6 16-3-7-7-1z"></path></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<script type="module">
import {db, ref, set, push, update, onValue, onChildAdded, remove} from "./firebase.js";
import { onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const params = new URLSearchParams(location.search);
let room = params.get("room") || "default";

// ---------------- COMPLEX ROOM BLOCKER ----------------
function showBlockAlert() {
  document.body.innerHTML = `
    <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050505; color:white; font-family:sans-serif; text-align:center; padding:20px;">
      <svg style="color:#ff4444; width:50px; height:50px; margin-bottom:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <h1 style="color:#ff4444; margin:0 0 10px 0;">Access Denied</h1>
      <p style="color:#a1a1aa;">This room is protected and cannot be accessed directly.</p>
      <button onclick="window.location.href='?room=default'" style="margin-top:20px; padding:12px 24px; background:#00dc82; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Go to Default Room</button>
    </div>
  `;
}
if(room.toLowerCase() === "complex" || room.toLowerCase() === "complexp") {
  showBlockAlert();
  throw new Error("Blocked Room Access"); // Stops further JS execution & Firebase Fetch
}

// ---------------- COOKIES & THEMES LOGIC ----------------
function setCookie(name, value, days = 365) {
  const d = new Date(); d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}
function getCookie(name) {
  const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}

const colors = [
  {hex: '#e50914', text: '#ffffff', name: 'Cinema Red'},
  {hex: '#d4af37', text: '#050505', name: 'Luxury Gold'},
  {hex: '#14b8a6', text: '#ffffff', name: 'Teal'},
  {hex: '#0ea5e9', text: '#ffffff', name: 'Sky'},
  {hex: '#f59e0b', text: '#000000', name: 'Amber'},
  {hex: '#ec4899', text: '#ffffff', name: 'Pink'},
  {hex: '#f97316', text: '#ffffff', name: 'Orange'},
  {hex: '#64748b', text: '#ffffff', name: 'Slate'},
  {hex: '#8b5cf6', text: '#ffffff', name: 'Violet'},
  {hex: '#3b82f6', text: '#ffffff', name: 'Blue'},
  {hex: '#00dc82', text: '#050505', name: 'Mint'}
];

function applyThemeColor(hex, textColor, name) {
  document.documentElement.style.setProperty('--accent-main', hex);
  document.documentElement.style.setProperty('--accent-text', textColor);
  document.documentElement.style.setProperty('--accent-dim', hex + '26'); // 15% opacity hex
  setCookie('asvm_color', hex);
  setCookie('asvm_color_text', textColor);
  if(name) setCookie('asvm_color_name', name);
}
window.applyThemeColor = applyThemeColor;

// Called from the theme picker swatches — applies color, updates the live
// preview chip, and re-highlights the active swatch, without closing the modal.
window.selectThemeColor = (hex, textColor, name) => {
  applyThemeColor(hex, textColor, name);
  document.querySelectorAll('.color-circle').forEach(el => {
    const isActive = el.dataset.hex && el.dataset.hex.toLowerCase() === hex.toLowerCase();
    el.classList.toggle('active', isActive);
    el.innerHTML = isActive ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:' + textColor + '"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '';
  });
  const previewLabel = document.getElementById('themePreviewLabel');
  const previewChip = document.getElementById('themePreviewChip');
  if(previewLabel) previewLabel.textContent = name || 'Custom';
  if(previewChip) previewChip.textContent = 'Applied';
}

window.toggleDarkMode = () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
  setCookie('asvm_mode', isLight ? 'dark' : 'light');
}

// Init theme from cookies
const savedColor = getCookie('asvm_color');
const savedText = getCookie('asvm_color_text');
const savedMode = getCookie('asvm_mode');
if(savedColor && savedText) applyThemeColor(savedColor, savedText);
if(savedMode) document.documentElement.setAttribute('data-theme', savedMode);

// ---------------- CUSTOM MODALS UI LOGIC ----------------
const modal = document.getElementById("customModal");
const modalContent = document.getElementById("modalContent");

function openModal(html) {
  modalContent.innerHTML = html;
  modal.style.display = 'flex';
  setTimeout(() => modal.style.opacity = '1', 10);
  toggleSidebar(true);
}
window.closeModal = () => {
  modal.style.opacity = '0';
  setTimeout(() => modal.style.display = 'none', 200);
}

window.toggleSidebar = (forceClose = false) => {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if(sb.style.right === '0px' || forceClose) {
    sb.style.right = '-300px'; overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 300);
  } else {
    overlay.style.display = 'block'; setTimeout(() => overlay.style.opacity = '1', 10);
    sb.style.right = '0px';
  }
}

// SIDEBAR ACTIONS
window.shareRoom = () => {
  const url = window.location.href;
  if(navigator.share) navigator.share({title:'ASVM', url});
  else { navigator.clipboard.writeText(url); alert("Link Copied!"); }
  toggleSidebar(true);
}
window.openChangeId = () => {
  openModal(`
    <h3>Change Room ID</h3>
    <input type="text" id="newIdInput" placeholder="Enter new Room ID...">
    <div>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="changeIdExec()">Join Room</button>
    </div>
  `);
}
window.changeIdExec = () => {
  const val = document.getElementById('newIdInput').value.trim();
  if(val) window.location.href = "?room=" + encodeURIComponent(val);
}
window.openDeleteId = () => {
  openModal(`
    <h3>Delete Room '${escapeHTML(room)}'?</h3>
    <p style="font-size:13px; color:var(--text-muted);">This clears the room database.</p>
    <div>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="background:#ff4444; color:white;" onclick="deleteIdExec()">Delete & Exit</button>
    </div>
  `);
}
window.deleteIdExec = () => {
  remove(ref(db, `rooms/${room}`));
  window.location.href = "?room=default";
}
window.clearChatUI = () => {
  document.getElementById("messages").innerHTML = "";
  toggleSidebar(true);
}

// ---------------- SAFE HTML ESCAPING (prevents chat XSS) ----------------
function escapeHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ---------------- RECENT ACTIONS TRACKER ----------------
let recentEvents = [];
function formatFullTime(ts) {
  return new Date(ts).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12:true});
}
window.openRecentActions = () => {
  let listHtml = recentEvents.slice().reverse().map(e => `
    <div class="action-item">
      <strong>${escapeHTML(e.name)}</strong> ${escapeHTML(e.action)} at ${formatFullTime(e.time)}
    </div>
  `).join('');
  if(recentEvents.length === 0) listHtml = `<p style="color:var(--text-muted);">No recent actions.</p>`;
  
  openModal(`
    <h3>Recent Actions</h3>
    <div id="recentActionsList">${listHtml}</div>
    <button class="btn-cancel" style="width:100%; margin-top:15px;" onclick="closeModal()">Close</button>
  `);
}

window.openThemePicker = () => {
  const currentAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent-main').trim();
  const currentName = getCookie('asvm_color_name') || (colors.find(c => c.hex.toLowerCase() === currentAccent.toLowerCase()) || {}).name || 'Custom';

  const swatches = colors.map(c => {
    const isActive = c.hex.toLowerCase() === currentAccent.toLowerCase();
    const check = isActive ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:${c.text}"><polyline points="20 6 9 17 4 12"></polyline></svg>` : '';
    return `
    <div class="color-swatch" title="${escapeHTML(c.name)}" onclick="selectThemeColor('${c.hex}', '${c.text}', '${escapeHTML(c.name)}')">
      <div class="color-circle ${isActive ? 'active' : ''}" data-hex="${c.hex}" style="background:${c.hex}; color:${c.hex};">${check}</div>
      <span class="color-label">${escapeHTML(c.name)}</span>
    </div>`;
  }).join('');

  openModal(`
    <h3>Theme Color</h3>
    <div class="theme-preview">
      <div class="theme-preview-dot"></div>
      <div class="theme-preview-text">
        <div class="theme-preview-label" id="themePreviewLabel">${escapeHTML(currentName)}</div>
        <div class="theme-preview-sub">Applies across buttons, links & chat</div>
      </div>
      <div class="theme-preview-chip" id="themePreviewChip">Active</div>
    </div>
    <div class="color-picker">${swatches}</div>
    <button class="btn-cancel" style="width:100%" onclick="closeModal()">Close</button>
  `);
}


// ---------------- USERNAME & JOINS ----------------
let username = localStorage.getItem("asvm_name") || "Anonymous_" + Math.floor(Math.random()*100);
localStorage.setItem("asvm_name", username);

const sessionId = Math.random().toString(36).substring(2,15);
const myJoinRef = ref(db, `rooms/${room}/active/${sessionId}`);
set(myJoinRef, { name: username, time: Date.now() });
onDisconnect(myJoinRef).remove(); // Auto trigger leave
window.addEventListener("beforeunload", () => remove(myJoinRef));

onChildAdded(ref(db, `rooms/${room}/active`), snap => {
  const data = snap.val();
  if(Date.now() - data.time < 10000) { 
    recentEvents.push({action: "Joined", name: data.name, time: data.time});
  }
});

import { onChildRemoved } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
onChildRemoved(ref(db, `rooms/${room}/active`), snap => {
  recentEvents.push({action: "Left", name: snap.val().name, time: Date.now()});
});

// ---------------- PLAYER & SYNC LOGIC ----------------
let plyrInstance = null;
let ytPlayer = null;
const plyrVideo = document.getElementById("player");
const ytWrap = document.getElementById("ytWrapper");
const plyrWrap = document.getElementById("plyrWrapper");

let ytApiReady = false;
let pendingYtId = null;
let currentSrc = "";
let isCurrentYt = false;
let ignoreSync = false;

window.onYouTubeIframeAPIReady = () => { ytApiReady = true; loadYtIfReady(); };

function emitSync(time, state) {
  if (ignoreSync) return;
  update(ref(db, `rooms/${room}/sync`), { time, state, by: username, ts: Date.now() });
}

function loadYtIfReady() {
  if(!ytApiReady || !pendingYtId) return;
  if(ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(pendingYtId);
  } else {
    ytPlayer = new YT.Player('ytPlayerDiv', {
      videoId: pendingYtId,
      playerVars: { rel: 0, enablejsapi: 1, autoplay: 1, modestbranding: 1 },
      events: {
        'onStateChange': (e) => {
          if(ignoreSync) return;
          if(e.data === YT.PlayerState.PLAYING) emitSync(ytPlayer.getCurrentTime(), 'play');
          if(e.data === YT.PlayerState.PAUSED) emitSync(ytPlayer.getCurrentTime(), 'pause');
        }
      }
    });
  }
}

onValue(ref(db, "rooms/"+room), snap => {
  const data = snap.val(); if(!data || !data.src) return;
  let url;
  try { url = atob(data.src); } catch(err) { console.error("Bad src encoding", err); return; }
  if(currentSrc === url) return;
  currentSrc = url;

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    isCurrentYt = true;
    plyrWrap.style.display = "none"; ytWrap.style.display = "block";
    if(plyrInstance) plyrInstance.pause();
    const ytMatch = url.match(/((youtu.be\/)|(v=))([^#&?]*)/);
    if(!ytMatch) { console.error("Could not parse YouTube ID from URL:", url); return; }
    pendingYtId = ytMatch[4];
    loadYtIfReady();
  } else {
    isCurrentYt = false;
    ytWrap.style.display = "none"; plyrWrap.style.display = "flex";
    if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    
    if(!plyrInstance) {
      plyrInstance = new Plyr(plyrVideo, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'] });
      plyrVideo.addEventListener('play', () => emitSync(plyrVideo.currentTime, 'play'));
      plyrVideo.addEventListener('pause', () => emitSync(plyrVideo.currentTime, 'pause'));
      plyrVideo.addEventListener('seeked', () => emitSync(plyrVideo.currentTime, plyrVideo.paused ? 'pause' : 'play'));
    }

    if(url.includes(".m3u8")) {
      if(Hls.isSupported()){ const hls=new Hls(); hls.loadSource(url); hls.attachMedia(plyrVideo); }
    } else {
      plyrInstance.source = { type:"video", sources:[{ src:url, type:"video/mp4" }] };
    }
  }
});

onValue(ref(db, `rooms/${room}/sync`), snap => {
  const data = snap.val();
  if(!data || data.by === username || Date.now() - data.ts > 3000) return;
  ignoreSync = true;
  const t = data.time;

  if(isCurrentYt && ytPlayer && ytPlayer.seekTo) {
    if(Math.abs(ytPlayer.getCurrentTime() - t) > 1.5) ytPlayer.seekTo(t, true);
    if(data.state === 'play') ytPlayer.playVideo(); else ytPlayer.pauseVideo();
  } else if (!isCurrentYt && plyrVideo) {
    if(Math.abs(plyrVideo.currentTime - t) > 1.5) plyrVideo.currentTime = t;
    if(data.state === 'play') plyrVideo.play().catch(()=>{}); else plyrVideo.pause();
  }
  setTimeout(() => { ignoreSync = false; }, 1500);
});

// ---------------- CHAT & TIMESTAMPS ----------------
let messagesMap = {}; let replyingTo = null;
const msgInput = document.getElementById("msg"); 
const msgBoxEl = document.getElementById("messages");

// EMOJI PICKER
const picker = new EmojiButton({ theme: 'dark', position: 'top-start' });
picker.on('emoji', emoji => { msgInput.value += emoji; msgInput.focus(); });
document.getElementById('emojiButton').addEventListener('click', () => picker.togglePicker(document.getElementById('emojiButton')));

msgInput.addEventListener('keypress', e => { if(e.key==="Enter") window.sendMsg(); });

window.initReply = id => {
  const m = messagesMap[id]; if(!m) return; replyingTo = { id, name: m.name, text: m.text };
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyName").innerText = m.name;
  document.getElementById("replyText").innerText = m.text.substring(0, 30); msgInput.focus();
}
window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

window.sendMsg = () => {
  const text=msgInput.value.trim(); if(!text) return;
  push(ref(db,"rooms/"+room+"/chat"),{ name:username, text, time:Date.now(), reply: replyingTo });
  msgInput.value=""; cancelReply();
}

onChildAdded(ref(db,"rooms/"+room+"/chat"), snap => {
  const m = snap.val(); messagesMap[snap.key] = m;
  const div = document.createElement("div"); 
  const isMe = m.name === username;
  div.className = "msg " + (isMe ? "right" : "left");
  
  // Format Time (HH:MM:SS AM/PM)
  const timeStr = formatFullTime(m.time);

  let quoteHTML = m.reply ? `<div class="quote-block"><div class="quote-name">${escapeHTML(m.reply.name)}</div><div>${escapeHTML(m.reply.text)}</div></div>` : "";
  
  div.innerHTML = `
    <div class="msg-content-wrapper">
      <div class="msgBox">
        ${quoteHTML}
        <div class="name">${escapeHTML(m.name)}</div>
        ${escapeHTML(m.text)}
        <div class="msg-timestamp">${timeStr}</div>
      </div>
      <button class="reply-btn" onclick="initReply('${snap.key}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"></path><path d="M4 15h11a5 5 0 0 0 5-5V6"></path></svg>
      </button>
    </div>
  `;
  msgBoxEl.appendChild(div);
  msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
});

// Resizer logic
const resizer = document.getElementById("resizer");
const playerContainer = document.getElementById("playerContainer");
const mainContainer = document.querySelector(".main-container");
let isResizing = false;
resizer.addEventListener("mousedown", initDrag);
resizer.addEventListener("touchstart", initDrag, {passive: false});
function initDrag() { isResizing = true; document.documentElement.addEventListener("mousemove", doDrag); document.documentElement.addEventListener("touchmove", doDrag, {passive: false}); document.documentElement.addEventListener("mouseup", stopDrag); document.documentElement.addEventListener("touchend", stopDrag); }
function doDrag(e) {
  if (!isResizing) return;
  let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
  let newHeight = clientY - playerContainer.getBoundingClientRect().top;
  if (newHeight >= 100 && newHeight <= mainContainer.clientHeight - 150) playerContainer.style.height = newHeight + "px";
}
function stopDrag() { isResizing = false; }
</script>
</body>
</html>
