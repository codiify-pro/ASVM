<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="description" content="ASVM is a free watch party platform to stream videos together with friends.">
<meta name="keywords" content="ASVM, watch videos together, sync video online, watch movies together">
<meta name="author" content="ASVM">

<style>
/* ---------------- PREMIUM DARK CSS VARIABLES ---------------- */
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
*:focus { outline: none; }

:root {
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.4);
  --bg-panel-hover: rgba(39, 39, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  
  --accent-main: #00dc82; 
  --accent-dim: rgba(0, 220, 130, 0.15);
  --accent-text: #050505; 
  
  --radius-xl: 24px; --radius-lg: 16px; --radius-md: 12px;
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  --plyr-color-main: var(--accent-main);
  --plyr-video-background: #000000;
}

body {
  margin: 0; background: var(--bg-base); font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-main); -webkit-font-smoothing: antialiased; overflow: hidden; height: 100dvh; display: flex; flex-direction: column;
}

/* Ambient Background Lights */
.ambient-glow-1, .ambient-glow-2 { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3; pointer-events: none; }
.ambient-glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--accent-dim), transparent 70%); }
.ambient-glow-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(14, 165, 233, 0.1), transparent 70%); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

/* ---------------- REFINED HEADER (Curved / Floating) ---------------- */
.topbar-wrapper { padding: 14px 16px 0; flex-shrink: 0; }
.topbar {
  background: linear-gradient(180deg, rgba(30,30,34,0.9), rgba(14,14,16,0.72));
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  padding: 0 22px; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border-color); border-radius: 999px; position: relative; z-index: 1000; height: 66px;
  max-width: 1000px; margin: 0 auto; width: 100%;
  box-shadow: 0 10px 34px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
}
.logo { font-size: 23px; font-weight: 800; letter-spacing: 0.5px; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
.logo span { color: var(--accent-main); text-shadow: 0 0 18px var(--accent-dim); }

.topbar-right { display: flex; align-items: center; gap: 10px; }

/* Live Badge in Header */
.live-badge {
  background: linear-gradient(135deg, rgba(0,220,130,0.14), rgba(0,220,130,0.04)); color: var(--accent-main); padding: 7px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 700; border: 1px solid rgba(0, 220, 130, 0.25); display: flex; align-items: center; gap: 7px;
  box-shadow: 0 4px 14px rgba(0,220,130,0.08);
}
.live-dot-header { width: 8px; height: 8px; background: var(--accent-main); border-radius: 50%; box-shadow: 0 0 10px var(--accent-main); animation: pulse 2s infinite; }

/* Custom Language Selector Dropdown */
.lang-dropdown-wrapper { position: relative; display: inline-block; }
.lang-btn {
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main);
  padding: 8px 14px 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: 0.2s;
}
.lang-btn svg { width: 16px; height: 16px; color: var(--text-muted); transition: 0.2s; }
.lang-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-main); }
.lang-btn:hover svg { color: var(--accent-main); }
.lang-menu {
  position: absolute; right: 0; top: 130%; background: #18181b; border: 1px solid var(--border-color);
  border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; width: 140px; z-index: 2500; overflow: hidden;
}
.lang-menu button {
  background: transparent; border: none; color: var(--text-main); padding: 12px 14px; text-align: left; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.02);
}
.lang-menu button:hover { background: var(--accent-dim); color: var(--accent-main); }

.icon-btn {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: 0.2s; width: 38px; height: 38px; border-radius: 50%;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { color: var(--accent-main); border-color: var(--accent-main); background: var(--accent-dim); transform: translateY(-1px); }

/* ---------------- SIDEBAR ---------------- */
.sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
.sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background: var(--bg-panel); backdrop-filter: blur(25px); border-left: 1px solid var(--border-color); z-index: 2001; transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; padding: 20px 0; box-shadow: -5px 0 30px rgba(0,0,0,0.3); }
.sidebar-header { padding: 0 20px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header button { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
.sidebar-header button:hover { color: #ff4444; }
.sidebar-header button svg { width: 24px; height: 24px; }
.sidebar-menu { display: flex; flex-direction: column; padding: 15px 0; }
.sidebar-menu button { background: transparent; border: none; color: var(--text-main); padding: 15px 20px; text-align: left; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
.sidebar-menu button svg { width: 18px; height: 18px; opacity: 0.8; }
.sidebar-menu button:hover { background: var(--accent-dim); color: var(--accent-main); border-left: 4px solid var(--accent-main); padding-left: 16px; }
.sidebar-menu button:hover svg { opacity: 1; stroke: var(--accent-main); }

/* ---------------- MISSING ROOM ID SCREEN ---------------- */
.missing-room-container {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 16px; height: 100%;
}
.missing-room-container svg { width: 72px; height: 72px; color: #ff4444; filter: drop-shadow(0 0 16px rgba(255, 68, 68, 0.3)); }
.missing-room-container h2 { font-size: 26px; font-weight: 700; margin: 0; color: var(--text-main); }
.missing-room-container p { color: var(--text-muted); font-size: 15px; margin: 0; max-width: 400px; line-height: 1.5; }

/* ---------------- LAYOUT & VIDEO PLAYER ---------------- */
.main-container { max-width: 1000px; width: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.playerWrap { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid var(--border-color); flex-shrink: 0; position: relative; }
.plyr { width: 100%; height: 100%; }

/* Resizer */
.resizer { height: 24px; width: 100%; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.6; transition: 0.2s; touch-action: none; }
.resizer-line { width: 40px; height: 5px; background: var(--text-muted); border-radius: 10px; transition: 0.2s; }
.resizer:hover .resizer-line { background: var(--accent-main); box-shadow: 0 0 10px var(--accent-main); }

/* ---------------- CHAT UI ---------------- */
.chatBox { width: 100%; flex: 1; min-height: 0; background: var(--bg-panel); backdrop-filter: blur(24px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.chatHeader { background: rgba(0,0,0,0.2); padding: 14px 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.chat-live-dot { width: 8px; height: 8px; background: var(--accent-main); border-radius: 50%; box-shadow: 0 0 10px var(--accent-main); animation: pulse 2s infinite; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }

.msg { display: flex; flex-direction: column; width: 100%; animation: messagePop 0.3s forwards; }
.msg-content-wrapper { display: flex; align-items: flex-end; width: 100%; gap: 6px; }
.msgBox { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; position: relative; }
.msg-timestamp { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

.left .msg-content-wrapper { justify-content: flex-start; }
.left .msgBox { background: var(--bg-panel-hover); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
.left .msg-timestamp { margin-left: 2px; text-align: left; }

.right .msg-content-wrapper { justify-content: flex-end; }
.right .msgBox { background: var(--accent-main); color: var(--accent-text); border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0, 220, 130, 0.2); font-weight: 500; }
.right .name { color: rgba(0,0,0,0.6); }
.right .msg-timestamp { margin-right: 2px; text-align: right; }

.quote-block { background: rgba(0, 0, 0, 0.25); border-left: 3px solid rgba(255,255,255,0.5); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; cursor: pointer; opacity: 0.85; transition: 0.2s; }
.quote-block:hover { opacity: 1; background: rgba(0,0,0,0.35); }
.quote-name { font-weight: 700; margin-bottom: 2px; }
.left .quote-block { border-left-color: var(--accent-main); }
.right .quote-block { border-left-color: var(--accent-text); }

.msgBox.highlighted { animation: highlightPulse 1.6s ease; }
@keyframes highlightPulse {
  0% { box-shadow: 0 0 0 0 var(--accent-main); background-color: var(--accent-dim); }
  60% { box-shadow: 0 0 0 10px rgba(0,220,130,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,220,130,0); }
}

.name { font-weight: 700; font-size: 12px; margin-bottom: 4px; opacity: 0.8; letter-spacing: 0.02em; }
.reply-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; opacity: 0.5; padding: 6px; transition: 0.2s; display: flex; align-items: center; }
.reply-btn svg { width: 16px; height: 16px; }
.reply-btn:hover { opacity: 1; color: var(--accent-main); transform: scale(1.1); }
.right .reply-btn { order: -1; }

.reply-preview { display: none; background: var(--bg-panel-hover); padding: 10px 16px; border-left: 3px solid var(--accent-main); font-size: 13px; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); }
.cancel-reply { cursor: pointer; color: #ff4444; display: flex; align-items: center; }
.cancel-reply svg { width: 18px; height: 18px; }

.chatInput { display: flex; padding: 12px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--border-color); gap: 10px; align-items: center; flex-shrink: 0; }
.chatInput input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 14px; transition: border-color 0.3s; }
.chatInput input:focus { border-color: var(--accent-main); background: rgba(0, 220, 130, 0.02); }
.send-btn { background: var(--accent-main); color: var(--accent-text); border: none; width: 44px; height: 44px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; }
.send-btn svg { width: 20px; height: 20px; }
.send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 220, 130, 0.3); }
.emoji-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; transition: 0.2s; }
.emoji-btn svg { width: 24px; height: 24px; }
.emoji-btn:hover { color: var(--text-main); }

/* ---------------- CUSTOM MODALS ---------------- */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 3000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }
.modal-box { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 26px; border-radius: var(--radius-xl); width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; backdrop-filter: blur(20px); }
.modal-box h3 { margin: 0 0 15px; color: var(--text-main); font-size: 19px; }
.modal-box input { width: 100%; padding: 13px 16px; margin-bottom: 15px; border-radius: 14px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.25); color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; }
.modal-box input:focus { border-color: var(--accent-main); box-shadow: 0 0 0 3px var(--accent-dim); }
.modal-box button { padding: 11px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; border: none; margin: 5px; transition: 0.2s; }
.btn-primary { background: var(--accent-main); color: var(--accent-text); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-dim); }
.btn-cancel { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-main); }
.btn-cancel:hover { background: rgba(255,255,255,0.1); }

#recentActionsList { max-height: 280px; overflow-y: auto; text-align: left; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.action-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid var(--border-color); transition: 0.2s; }
.action-item:hover { background: rgba(255,255,255,0.08); border-color: var(--accent-main); }
.action-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #050505; }
.action-body { flex: 1; min-width: 0; }
.action-line { color: var(--text-main); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-label { color: var(--text-muted); font-weight: 500; }
.action-time { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.action-type-icon { flex-shrink: 0; display: flex; }
.action-type-icon svg { width: 16px; height: 16px; }

.live-summary { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,220,130,0.08); border: 1px solid rgba(0,220,130,0.2); border-radius: 999px; padding: 8px 16px; margin-bottom: 16px; font-size: 13px; color: var(--text-main); }

/* Hide default Google Translate element completely to prevent watermark/banner */
#google_translate_element, .goog-te-banner-frame, .goog-te-gadget, .skiptranslate { display: none !important; }
body { top: 0px !important; }

@keyframes messagePop { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-dim); } 70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
</style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<!-- Hidden Google Translate Element -->
<div id="google_translate_element"></div>

<!-- Missing Room Display (Hidden by default) -->
<div id="missingRoom" class="missing-room-container" style="display: none;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h2>Room ID is Missing</h2>
  <p>Please enter a valid room ID or create a new one to join the watch party.</p>
</div>

<!-- Main App (Hidden if room is invalid) -->
<div id="mainApp" style="display: none; flex-direction: column; flex: 1; height: 100%;">
  <!-- Custom Modals -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box" id="modalContent"></div>
  </div>

  <!-- Sidebar Menu -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar" translate="no">
    <div class="sidebar-header">
      Menu 
      <button onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="sidebar-menu">
      <button onclick="shareRoom()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        Share Room
      </button>
      <button onclick="openChangeName()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Change Name
      </button>
      <button onclick="openRecentActions()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Recent Actions
      </button>
      <button onclick="clearChatUI()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
        Clear Chat Screen
      </button>
    </div>
  </div>

  <div class="topbar-wrapper">
  <div class="topbar" translate="no">
    <div class="logo">ASVM<span>.</span></div>
    <div class="topbar-right">
      <!-- Live Users Badge in Header -->
      <div class="live-badge" title="Active users in room">
        <div class="live-dot-header"></div>
        Live: <span id="headerLiveCount">0</span>
      </div>

      <!-- Google Translator 10 Languages Dropdown -->
      <div class="lang-dropdown-wrapper">
        <button class="lang-btn" onclick="toggleLangMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span id="currentLangLabel">Language</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <button onclick="changeLanguage('en', 'English')">English</button>
          <button onclick="changeLanguage('hi', 'Hindi')">Hindi</button>
          <button onclick="changeLanguage('es', 'Spanish')">Spanish</button>
          <button onclick="changeLanguage('fr', 'French')">French</button>
          <button onclick="changeLanguage('de', 'German')">German</button>
          <button onclick="changeLanguage('zh-CN', 'Chinese')">Chinese</button>
          <button onclick="changeLanguage('ja', 'Japanese')">Japanese</button>
          <button onclick="changeLanguage('ar', 'Arabic')">Arabic</button>
          <button onclick="changeLanguage('ru', 'Russian')">Russian</button>
          <button onclick="changeLanguage('pt', 'Portuguese')">Portuguese</button>
        </div>
      </div>

      <button class="icon-btn" onclick="toggleSidebar()" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </div>
  </div>

  <div class="main-container">
    <div class="playerWrap" id="playerContainer" translate="no">
      <video id="player" controls playsinline></video>
    </div>

    <div class="resizer" id="resizer">
      <div class="resizer-line"></div>
    </div>

    <div class="chatBox" id="chat">
      <div class="chatHeader" translate="no">
        <div class="chat-live-dot"></div> <span>Room Chat</span>
      </div>

      <div id="messages"></div>
      
      <div class="reply-preview" id="replyPreview" translate="no">
        <div class="reply-preview-text">Replying to <strong id="replyName"></strong>: <span id="replyText"></span></div>
        <div class="cancel-reply" onclick="cancelReply()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>

      <div class="chatInput" translate="no">
        <button class="emoji-btn" id="emojiButton">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        </button>
        <input id="msg" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" onclick="sendMsg()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<!-- Google Translate Initialization Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script type="module">
import {db, ref, set, push, update, onValue, onChildAdded} from "./firebase.js";
import { onDisconnect, remove, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const params = new URLSearchParams(location.search);
let room = params.get("room");

// ---------------- COOKIE HELPERS ----------------
function setCookie(name, value, days = 365) {
  const d = new Date(); d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
}
function getCookie(name) {
  const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? decodeURIComponent(v[2]) : null;
}

// ---------------- CHECK ROOM ID LOGIC ----------------
if(!room || room.trim() === "" || room.toLowerCase() === "default") {
  document.getElementById("missingRoom").style.display = "flex";
} else {
  // If Room ID is valid, show app and run logic
  document.getElementById("mainApp").style.display = "flex";
  initRoomLogic();
}

// ---------------- GOOGLE TRANSLATOR LOGIC ----------------
window.toggleLangMenu = () => {
  const menu = document.getElementById("langMenu");
  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

window.changeLanguage = (langCode, langName) => {
  document.getElementById("currentLangLabel").innerText = langName;
  document.getElementById("langMenu").style.display = "none";
  
  const triggerTranslation = () => {
    let selectField = document.querySelector(".goog-te-combo");
    if(selectField) {
      selectField.value = langCode;
      selectField.dispatchEvent(new Event('change'));
    }
  };
  
  triggerTranslation();
  setTimeout(triggerTranslation, 1000); // Retry fallback
}

window.addEventListener('click', (e) => {
  if(!e.target.closest('.lang-dropdown-wrapper')) {
    const menu = document.getElementById("langMenu");
    if(menu) menu.style.display = 'none';
  }
});

function initRoomLogic() {
  // ---------------- CUSTOM MODALS UI LOGIC ----------------
  const modal = document.getElementById("customModal");
  const modalContent = document.getElementById("modalContent");

  window.openModal = function(html) {
    modalContent.innerHTML = html;
    modal.style.display = 'flex';
    setTimeout(() => modal.style.opacity = '1', 10);
    window.toggleSidebar(true);
  }
  window.closeModal = () => {
    modal.style.opacity = '0';
    setTimeout(() => modal.style.display = 'none', 200);
  }

  window.toggleSidebar = (forceClose = false) => {
    const sb = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if(sb.style.right === '0px' || forceClose === true) {
      sb.style.right = '-300px'; overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 300);
    } else {
      overlay.style.display = 'block'; setTimeout(() => overlay.style.opacity = '1', 10);
      sb.style.right = '0px';
    }
  }

  // SIDEBAR ACTIONS
  window.shareRoom = () => {
    const url = window.location.href;
    if(navigator.share) navigator.share({title:'ASVM', url});
    else { navigator.clipboard.writeText(url); alert("Link Copied!"); }
    window.toggleSidebar(true);
  }
  window.openChangeName = () => {
    window.openModal(`
      <h3>Change Name</h3>
      <input type="text" id="newNameInput" placeholder="Enter your name..." value="${username}">
      <div>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="changeNameExec()">Save</button>
      </div>
    `);
  }
  window.changeNameExec = () => {
    const val = document.getElementById('newNameInput').value.trim();
    if(!val) return;
    username = val;
    setCookie('asvm_name', username);
    update(myJoinRef, { name: username });
    closeModal();
  }
  window.clearChatUI = () => {
    document.getElementById("messages").innerHTML = "";
    window.toggleSidebar(true);
  }

  // ---------------- RECENT ACTIONS TRACKER ----------------
  let recentEvents = [];
  function formatFullTime(ts) {
    return new Date(ts).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12:true});
  }

  const avatarPalette = ['#00dc82', '#0ea5e9', '#f59e0b', '#ec4899', '#8b5cf6', '#ef4444', '#14b8a6', '#f97316'];
  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return avatarPalette[Math.abs(hash) % avatarPalette.length];
  }

  const icons = {
    joined: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>',
    messaged: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>'
  };
  function actionMeta(action) {
    if (action.includes('joined')) return { icon: icons.joined, color: '#00dc82', label: 'joined' };
    if (action.includes('left')) return { icon: icons.left, color: '#ef4444', label: 'left' };
    return { icon: icons.messaged, color: '#0ea5e9', label: 'sent a message' };
  }

  window.openRecentActions = () => {
    let listHtml = recentEvents.map(e => {
      const meta = actionMeta(e.action);
      const initial = (e.name || '?').trim().charAt(0).toUpperCase();
      return `
      <div class="action-item">
        <div class="action-avatar" style="background:${avatarColor(e.name)}">${initial}</div>
        <div class="action-body">
          <div class="action-line"><strong>${e.name}</strong> <span class="action-label">${meta.label}</span></div>
          <div class="action-time">${formatFullTime(e.time)}</div>
        </div>
        <div class="action-type-icon" style="color:${meta.color}">${meta.icon}</div>
      </div>
    `;
    }).join('');
    if(recentEvents.length === 0) listHtml = `<p style="color:var(--text-muted); text-align:center; padding:10px 0;">No recent actions.</p>`;
    
    window.openModal(`
      <h3>Recent Actions</h3>
      <div class="live-summary">
        <div class="live-dot-header"></div>
        <span><strong>${liveCount}</strong> live right now</span>
      </div>
      <div id="recentActionsList">${listHtml}</div>
      <button class="btn-cancel" style="width:100%; margin-top:15px;" onclick="closeModal()">Close</button>
    `);
  }

  function addEventToTracker(name, action, time) {
    recentEvents.unshift({name, action, time}); // Add to start
    if(recentEvents.length > 50) recentEvents.pop(); // Keep array small
  }

  // ---------------- USERNAME & JOINS ----------------
  let username = getCookie("asvm_name") || "Anonymous_" + Math.floor(Math.random()*100);
  setCookie("asvm_name", username);

  const sessionId = Math.random().toString(36).substring(2,15);
  const myJoinRef = ref(db, `rooms/${room}/active/${sessionId}`);
  set(myJoinRef, { name: username, time: Date.now() });
  onDisconnect(myJoinRef).remove(); 
  window.addEventListener("beforeunload", () => remove(myJoinRef));

  // Update Header Live Count
  let liveCount = 0;
  onValue(ref(db, `rooms/${room}/active`), snap => {
    const data = snap.val();
    liveCount = data ? Object.keys(data).length : 0;
    document.getElementById("headerLiveCount").innerText = liveCount;
  });

  onChildAdded(ref(db, `rooms/${room}/active`), snap => {
    const data = snap.val();
    if(data && Date.now() - data.time < 15000) { 
      addEventToTracker(data.name, "joined the room at", data.time);
    }
  });

  onChildRemoved(ref(db, `rooms/${room}/active`), snap => {
    const data = snap.val();
    if(data) addEventToTracker(data.name, "left the room at", Date.now());
  });

  // ---------------- PLAYER & SYNC LOGIC (Plyr only, incl. YouTube) ----------------
  let plyrInstance = null;
  const plyrVideo = document.getElementById("player");
  let currentSrc = "";
  let ignoreSync = false;

  function emitSync(time, state) {
    if (ignoreSync) return;
    update(ref(db, `rooms/${room}/sync`), { time, state, by: username, ts: Date.now() });
  }

  function ensurePlyr() {
    if (plyrInstance) return plyrInstance;
    plyrInstance = new Plyr(plyrVideo, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
      settings: ['quality', 'speed'],
      youtube: { noCookie: false, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }
    });
    plyrInstance.on('play', () => emitSync(plyrInstance.currentTime, 'play'));
    plyrInstance.on('pause', () => emitSync(plyrInstance.currentTime, 'pause'));
    plyrInstance.on('seeked', () => emitSync(plyrInstance.currentTime, plyrInstance.paused ? 'pause' : 'play'));
    return plyrInstance;
  }

  onValue(ref(db, "rooms/"+room), snap => {
    const data = snap.val(); if(!data || !data.src) return;
    const url = atob(data.src);
    if(currentSrc === url) return;
    currentSrc = url;

    const p = ensurePlyr();

    if (url.includes("youtube.com") || url.includes("youtu.be")) {
      const ytId = url.match(/((youtu.be\/)|(v=))([^#&?]*)/)[4];
      p.source = { type: 'video', sources: [{ src: ytId, provider: 'youtube' }] };
    } else if (url.includes(".m3u8")) {
      // Force a native <video> element back before attaching hls.js
      p.source = { type: 'video', sources: [{ src: '', type: 'video/mp4' }] };
      setTimeout(() => {
        const mediaEl = p.media;
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(mediaEl);
        } else if (mediaEl.canPlayType('application/vnd.apple.mpegurl')) {
          mediaEl.src = url;
        }
      }, 60);
    } else {
      p.source = { type: 'video', sources: [{ src: url, type: 'video/mp4' }] };
    }
  });

  onValue(ref(db, `rooms/${room}/sync`), snap => {
    const data = snap.val();
    if(!data || !plyrInstance || data.by === username || Date.now() - data.ts > 3000) return;
    ignoreSync = true;
    const t = data.time;
    if(Math.abs(plyrInstance.currentTime - t) > 1.5) plyrInstance.currentTime = t;
    if(data.state === 'play') plyrInstance.play().catch(()=>{}); else plyrInstance.pause();
    setTimeout(() => { ignoreSync = false; }, 1500);
  });

  // ---------------- CHAT, EMOJIS & TIMESTAMPS ----------------
  let messagesMap = {}; let replyingTo = null;
  const msgInput = document.getElementById("msg"); 
  const msgBoxEl = document.getElementById("messages");

  // EMOJI PICKER
  const picker = new EmojiButton({ theme: 'dark', position: 'top-start' });
  const emojiBtn = document.getElementById('emojiButton');
  picker.on('emoji', emoji => { msgInput.value += emoji; msgInput.focus(); });
  emojiBtn.addEventListener('click', () => picker.togglePicker(emojiBtn));

  msgInput.addEventListener('keypress', e => { if(e.key==="Enter") window.sendMsg(); });

  window.initReply = id => {
    const m = messagesMap[id]; if(!m) return; replyingTo = { id, name: m.name, text: m.text };
    document.getElementById("replyPreview").style.display = "flex";
    document.getElementById("replyName").innerText = m.name;
    document.getElementById("replyText").innerText = m.text.substring(0, 30); msgInput.focus();
  }
  window.cancelReply = () => { replyingTo = null; document.getElementById("replyPreview").style.display = "none"; }

  window.scrollToMessage = (id) => {
    const el = document.getElementById('msg-' + id);
    if(!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('highlighted');
    void el.offsetWidth; // restart animation if clicked again quickly
    el.classList.add('highlighted');
    setTimeout(() => el.classList.remove('highlighted'), 1600);
  }

  window.sendMsg = () => {
    const text=msgInput.value.trim(); if(!text) return;
    push(ref(db,"rooms/"+room+"/chat"),{ name:username, text, time:Date.now(), reply: replyingTo });
    msgInput.value=""; cancelReply();
  }

  onChildAdded(ref(db,"rooms/"+room+"/chat"), snap => {
    const m = snap.val(); messagesMap[snap.key] = m;
    
    // Add to recent tracker
    if(Date.now() - m.time < 15000) {
      addEventToTracker(m.name, "messaged at", m.time);
    }

    const div = document.createElement("div"); 
    const isMe = m.name === username;
    div.className = "msg " + (isMe ? "right" : "left");
    
    const timeStr = formatFullTime(m.time);
    let quoteHTML = m.reply ? `<div class="quote-block" onclick="scrollToMessage('${m.reply.id}')"><div class="quote-name">${m.reply.name}</div><div>${m.reply.text}</div></div>` : "";
    
    div.innerHTML = `
      <div class="msg-content-wrapper">
        <div class="msgBox" id="msg-${snap.key}">
          ${quoteHTML}
          <div class="name">${m.name}</div>
          ${m.text}
          <div class="msg-timestamp">${timeStr}</div>
        </div>
        <button class="reply-btn" onclick="initReply('${snap.key}')" title="Reply">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
        </button>
      </div>
    `;
    msgBoxEl.appendChild(div);
    msgBoxEl.scrollTop = msgBoxEl.scrollHeight;
  });

  // ---------------- RESIZER LOGIC ----------------
  const resizer = document.getElementById("resizer");
  const playerContainer = document.getElementById("playerContainer");
  const mainContainer = document.querySelector(".main-container");
  let isResizing = false;
  resizer.addEventListener("mousedown", initDrag);
  resizer.addEventListener("touchstart", initDrag, {passive: false});
  function initDrag() { isResizing = true; document.documentElement.addEventListener("mousemove", doDrag); document.documentElement.addEventListener("touchmove", doDrag, {passive: false}); document.documentElement.addEventListener("mouseup", stopDrag); document.documentElement.addEventListener("touchend", stopDrag); }
  function doDrag(e) {
    if (!isResizing) return;
    let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    let newHeight = clientY - playerContainer.getBoundingClientRect().top;
    if (newHeight >= 100 && newHeight <= mainContainer.clientHeight - 150) playerContainer.style.height = newHeight + "px";
  }
  function stopDrag() { isResizing = false; }
}
</script>
</body>
</html>
