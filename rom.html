<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Watch Party Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* Pehla wala same UI aur Design maintain kiya gaya hai */
:root {
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --accent-mint: #00dc82;
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
}

body {
  margin: 0; background: var(--bg-base); font-family: 'Inter', sans-serif;
  color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
}

.topbar {
  height: 64px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 20px; border-bottom: 1px solid var(--border-color); z-index: 100;
}

.logo { font-size: 20px; font-weight: 800; }
.logo span { color: var(--accent-mint); }

.room-badge { background: rgba(0, 220, 130, 0.1); color: var(--accent-mint); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(0, 220, 130, 0.2); }

.main-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; max-width: 1000px; margin: 0 auto; width: 100%; min-height: 0; }

.playerWrap { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); flex-shrink: 0; }

.chatBox { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

#messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

/* Chat Bubbles */
.msg { display: flex; width: 100%; margin-bottom: 5px; }
.msgBox { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; position: relative; }
.left { justify-content: flex-start; }
.left .msgBox { background: #27272a; border-bottom-left-radius: 4px; }
.right { justify-content: flex-end; }
.right .msgBox { background: var(--accent-mint); color: #000; font-weight: 500; border-bottom-right-radius: 4px; }
.name { font-size: 11px; font-weight: 700; opacity: 0.7; margin-bottom: 3px; display: block; }

/* System/Admin Welcome Message */
.system-msg .msgBox { background: rgba(0, 220, 130, 0.15) !important; color: #fff !important; border: 1px solid var(--accent-mint); }

.chatInput { display: flex; padding: 12px; background: rgba(0,0,0,0.2); gap: 10px; border-top: 1px solid var(--border-color); }
.chatInput input { flex: 1; background: #18181b; border: 1px solid var(--border-color); padding: 10px 15px; color: #fff; border-radius: 10px; }
.chatInput button { background: var(--accent-mint); border: none; padding: 0 15px; border-radius: 10px; font-weight: 700; cursor: pointer; }

/* Plyr Custom Theme */
.plyr--full-ui.plyr--video { --plyr-color-main: #00dc82; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="room-badge" id="roomDisplay">Loading...</div>
</div>

<div class="main-container">
  <div class="playerWrap">
    <video id="player" playsinline controls></video>
  </div>

  <div class="chatBox">
    <div id="messages"></div>
    <div class="chatInput">
      <input id="msgInput" placeholder="Message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script type="module">
import { db, ref, onValue, push, get, onChildAdded } from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const roomId = params.get("room");

// 1. Room Validation & Redirect
if (!roomId) {
    window.location.href = "/found";
}

const videoElement = document.getElementById("player");
const messagesContainer = document.getElementById("messages");
const roomDisplay = document.getElementById("roomDisplay");
let player;
let username = localStorage.getItem("asvm_name") || prompt("Apna naam batayein:") || "Guest";
localStorage.setItem("asvm_name", username);

// Room check function
async function validateRoom() {
    const roomRef = ref(db, `rooms/${roomId}`);
    const snapshot = await get(roomRef);
    
    if (!snapshot.exists()) {
        console.error("Room valid nahi hai!");
        window.location.href = "/found";
        return;
    }
    
    roomDisplay.innerText = "Room: " + roomId;
    setupPlayer();
    setupChat();
}

// 2. Welcome Message (From ASVM)
function addWelcomeMessage() {
    const div = document.createElement("div");
    div.className = "msg left system-msg";
    div.innerHTML = `<div class="msgBox"><span class="name">ASVM (Admin)</span>Hey! Welcome to ASVM Player. Enjoy syncing and chatting! 🍿</div>`;
    messagesContainer.appendChild(div);
}

// 3. Player Setup (HLS + YT Quality)
function setupPlayer() {
    const roomRef = ref(db, `rooms/${roomId}`);
    
    onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.src) return;

        let videoUrl;
        try {
            videoUrl = atob(data.src); // URL base64 encoded honi chahiye
        } catch (e) {
            videoUrl = data.src; // Agar encoded nahi hai to direct use karein
        }

        console.log("Loading URL:", videoUrl);

        // Plyr Configuration
        const options = {
            quality: { default: 720, options: [1080, 720, 480, 360] },
            settings: ['quality', 'speed']
        };

        if (videoUrl.includes("m3u8")) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player = new Plyr(videoElement, options);
                });
                window.hls = hls;
            }
        } else if (videoUrl.includes("youtube.com") || videoUrl.includes("youtu.be")) {
            player = new Plyr(videoElement, options);
            player.source = { type: 'video', sources: [{ src: videoUrl, provider: 'youtube' }] };
        } else {
            player = new Plyr(videoElement, options);
            player.source = { type: 'video', sources: [{ src: videoUrl, type: 'video/mp4' }] };
        }
    }, { onlyOnce: true });
}

// 4. Chat Setup
function setupChat() {
    addWelcomeMessage();
    const chatRef = ref(db, `rooms/${roomId}/chat`);

    onChildAdded(chatRef, (snapshot) => {
        const msg = snapshot.val();
        const isMe = msg.name === username;
        
        const div = document.createElement("div");
        div.className = `msg ${isMe ? 'right' : 'left'}`;
        div.innerHTML = `<div class="msgBox"><span class="name">${msg.name}</span>${msg.text}</div>`;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
}

window.sendMessage = () => {
    const input = document.getElementById("msgInput");
    if (!input.value.trim()) return;

    const chatRef = ref(db, `rooms/${roomId}/chat`);
    push(chatRef, {
        name: username,
        text: input.value,
        timestamp: Date.now()
    });
    input.value = "";
};

// Start validation
validateRoom();

</script>
</body>
</html>
