<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Ultra-Modern SaaS Variables (Green/Mint Tone) */
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
*:focus { outline: none; }
:root {
  --bg-base: #050505;
  --bg-panel: rgba(24, 24, 27, 0.4);
  --bg-panel-hover: rgba(39, 39, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  --accent-mint: #00dc82; 
  --accent-mint-dim: rgba(0, 220, 130, 0.15);
  --radius-lg: 16px;
  --radius-md: 12px;
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  --plyr-color-main: #00dc82;
}

body {
  margin: 0; background: var(--bg-base);
  font-family: 'Inter', sans-serif; color: var(--text-main);
  overflow: hidden; height: 100dvh; display: flex; flex-direction: column;
}

/* Background Glows */
.ambient-glow-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--accent-mint-dim), transparent 70%); filter: blur(120px); z-index: -1; opacity: 0.3; }

.topbar {
  background: rgba(5, 5, 5, 0.6); backdrop-filter: blur(20px);
  padding: 0 16px; display: flex; justify-content: space-between;
  align-items: center; border-bottom: 1px solid var(--border-color);
  height: 60px; flex-shrink: 0; z-index: 100;
}
.logo { font-size: 20px; font-weight: 800; color: white; }
.logo span { color: var(--accent-mint); }

.main-container {
  max-width: 1000px; width: 100%; margin: 0 auto; padding: 12px;
  display: flex; flex-direction: column; flex: 1; min-height: 0;
}

/* Video Player */
.playerWrap {
  width: 100%; height: 200px; /* Default mobile height */
  background: #000; border-radius: var(--radius-lg);
  overflow: hidden; border: 1px solid var(--border-color);
  flex-shrink: 0; position: relative;
}
@media (min-width: 768px) { .playerWrap { height: 450px; } }

/* Resizer Slider */
.resizer {
  height: 30px; width: 100%; cursor: ns-resize;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; touch-action: none;
}
.resizer-line { width: 50px; height: 5px; background: var(--border-color); border-radius: 10px; transition: 0.2s; }
.resizer:active .resizer-line { background: var(--accent-mint); width: 60px; }

/* Chat UI */
.chatBox {
  flex: 1; display: flex; flex-direction: column;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  border: 1px solid var(--border-color); border-radius: var(--radius-lg);
  overflow: hidden; min-height: 0;
}
.chatHeader { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.live-dot { width: 8px; height: 8px; background: var(--accent-mint); border-radius: 50%; box-shadow: 0 0 8px var(--accent-mint); }

#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.msg { display: flex; width: 100%; animation: messagePop 0.3s ease; }
.msgBox { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; position: relative; }
.name { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.6; }

.left { justify-content: flex-start; }
.left .msgBox { background: var(--bg-panel-hover); border-bottom-left-radius: 4px; }
.right { justify-content: flex-end; }
.right .msgBox { background: var(--accent-mint); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }

/* Emoji & Input */
.chatInput { display: flex; padding: 12px; gap: 8px; border-top: 1px solid var(--border-color); align-items: center; }
.chatInput input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; color: white; font-size: 14px; }
.chatInput input:focus { border-color: var(--accent-mint); }

.icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; padding: 5px; }
.send-btn { background: var(--accent-mint); color: #000; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }

@keyframes messagePop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="ambient-glow-1"></div>

<div class="topbar">
  <div class="logo">ASVM<span>.</span></div>
  <div class="room-badge" id="roomId">Room: Loading...</div>
</div>

<div class="main-container">
  <div class="playerWrap" id="playerContainer">
    <video id="player" controls playsinline></video>
  </div>

  <div class="resizer" id="resizer">
    <div class="resizer-line"></div>
  </div>

  <div class="chatBox">
    <div class="chatHeader"><div class="live-dot"></div> Room Chat</div>
    <div id="messages"></div>
    <div class="chatInput">
      <button class="icon-btn" id="emojiButton">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>
      <input id="msgInput" placeholder="Type a message..." autocomplete="off">
      <button class="send-btn" onclick="sendMsg()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.3/dist/index.min.js"></script>

<script type="module">
import {db,ref,onValue,push,onChildAdded} from "./firebase.js"

const params = new URLSearchParams(location.search);
const room = params.get("room") || "Global";
document.getElementById("roomId").innerText = "Room: " + room;

const player = new Plyr('#player');
const msgBox = document.getElementById("messages");
const msgInput = document.getElementById("msgInput");
let username = localStorage.getItem("asvm_name") || prompt("Enter Name:") || "Guest";
localStorage.setItem("asvm_name", username);

// --- 1. Welcome Message System ---
function showWelcome() {
    const div = document.createElement("div");
    div.className = "msg left";
    div.innerHTML = `<div class="msgBox"><div class="name">ASVM</div>Hey! Welcome to ASVM Player 👋</div>`;
    msgBox.appendChild(div);
}
showWelcome();

// --- 2. Emoji Picker ---
const picker = new EmojiButton({ theme: 'dark', position: 'top-start' });
const emojiBtn = document.getElementById('emojiButton');
picker.on('emoji', emoji => { msgInput.value += emoji; });
emojiBtn.addEventListener('click', () => picker.togglePicker(emojiBtn));

// --- 3. Firebase Video Sync ---
onValue(ref(db, "rooms/" + room), snap => {
    const data = snap.val();
    if(!data) return;
    const url = atob(data.src);
    if(url.includes("youtube.com") || url.includes("youtu.be")) {
        player.source = { type: 'video', sources: [{ src: url, provider: 'youtube' }] };
    } else if(url.includes(".m3u8")) {
        if(Hls.isSupported()) { const hls = new Hls(); hls.loadSource(url); hls.attachMedia(document.getElementById('player')); }
    } else {
        player.source = { type: 'video', sources: [{ src: url, type: 'video/mp4' }] };
    }
}, { onlyOnce: true });

// --- 4. Chat System ---
window.sendMsg = () => {
    const text = msgInput.value.trim();
    if(!text) return;
    push(ref(db, "rooms/" + room + "/chat"), { name: username, text: text, time: Date.now() });
    msgInput.value = "";
};
msgInput.onkeypress = (e) => { if(e.key === "Enter") sendMsg(); };

onChildAdded(ref(db, "rooms/" + room + "/chat"), snap => {
    const m = snap.val();
    const isMe = m.name === username;
    const div = document.createElement("div");
    div.className = "msg " + (isMe ? "right" : "left");
    div.innerHTML = `<div class="msgBox"><div class="name">${m.name}</div>${m.text}</div>`;
    msgBox.appendChild(div);
    msgBox.scrollTop = msgBox.scrollHeight;
});

// --- 5. Fix Slider (Resizer) Logic ---
const resizer = document.getElementById("resizer");
const playerWrap = document.getElementById("playerContainer");
let isResizing = false;

const startResizing = (e) => { isResizing = true; document.body.style.cursor = "ns-resize"; };
const stopResizing = () => { isResizing = false; document.body.style.cursor = "default"; };
const onResize = (e) => {
    if (!isResizing) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const newHeight = clientY - playerWrap.offsetTop;
    if (newHeight > 100 && newHeight < window.innerHeight - 200) {
        playerWrap.style.height = newHeight + "px";
    }
};

resizer.addEventListener("mousedown", startResizing);
resizer.addEventListener("touchstart", startResizing);
document.addEventListener("mousemove", onResize);
document.addEventListener("touchmove", onResize);
document.addEventListener("mouseup", stopResizing);
document.addEventListener("touchend", stopResizing);

</script>
</body>
</html>
