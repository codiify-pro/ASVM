<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM Ultra Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-base: #020617;
  --bg-panel: #0f172a;
  --bg-card: #1e293b;
  --border-color: rgba(255, 255, 255, 0.06);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  
  --accent-primary: #10b981; /* Emerald */
  --accent-danger: #ef4444; /* Red */
  --accent-info: #3b82f6; /* Blue */
  
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-base);
  color: var(--text-main);
}

/* Navbar */
.navbar {
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(20px);
  padding: 15px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo-section { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 20px; font-weight: 800; color: var(--accent-primary); letter-spacing: -0.5px; }

/* Buttons */
.btn {
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
}

.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--accent-danger); border-color: rgba(239, 68, 68, 0.2); }
.btn-danger:hover { background: var(--accent-danger); color: white; transform: translateY(-2px); }

.btn-edit { background: rgba(59, 130, 246, 0.1); color: var(--accent-info); border-color: rgba(59, 130, 246, 0.2); }
.btn-edit:hover { background: var(--accent-info); color: white; }

/* Container */
.container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-panel);
  padding: 24px;
  border-radius: 24px;
  border: 1px solid var(--border-color);
  position: relative;
  overflow: hidden;
}

.stat-card h3 { font-size: 14px; color: var(--text-muted); margin: 0; font-weight: 500; }
.stat-card h2 { font-size: 28px; margin: 10px 0 0 0; font-weight: 700; }

/* Panel */
.panel {
  background: var(--bg-panel);
  border-radius: 24px;
  border: 1px solid var(--border-color);
  overflow: hidden;
}

.panel-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.room-list { padding: 15px; display: grid; gap: 12px; }

/* Room Item */
.room-item {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all var(--transition);
}

.room-item:hover {
  background: rgba(30, 41, 59, 0.8);
  transform: scale(1.01);
  border-color: rgba(16, 185, 129, 0.3);
}

.room-info { display: flex; align-items: center; gap: 15px; }
.room-icon { 
  width: 45px; height: 45px; background: #0f172a; 
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  color: var(--accent-primary);
}

.room-details h4 { margin: 0; font-size: 15px; }
.room-url-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; opacity: 0.7; }

.actions { display: flex; gap: 8px; }

/* Modal/Alert Styles */
.empty-state { text-align: center; padding: 50px; color: var(--text-muted); }

@media(max-width: 600px) {
  .room-item { flex-direction: column; align-items: flex-start; gap: 15px; }
  .actions { width: 100%; }
  .actions button { flex: 1; justify-content: center; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-section">
    <div class="logo">ASVM ADMIN</div>
  </div>
  <button class="btn btn-danger" onclick="deleteAllRooms()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6m4-11v6"/></svg>
    Clear All Rooms
  </button>
</nav>

<div class="container">
  
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Live Rooms</h3>
      <h2 id="roomCount">0</h2>
    </div>
    <div class="stat-card">
      <h3>Total Chats</h3>
      <h2 id="chatCount">0</h2>
    </div>
    <div class="stat-card">
      <h3>Database Load</h3>
      <h2 id="dbSize">0.00 KB</h2>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 style="font-size: 16px; margin:0;">Active Room Management</h2>
    </div>
    
    <div class="room-list" id="roomList">
      <div class="empty-state">Fetching database...</div>
    </div>
  </div>

</div>

<script type="module">
import { db } from "/firebase.js";
import {
  ref,
  onValue,
  remove,
  update 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const roomList = document.getElementById("roomList");
const roomCount = document.getElementById("roomCount");
const chatCount = document.getElementById("chatCount");
const dbSizeEl = document.getElementById("dbSize");

// Monitor Data
onValue(ref(db, "rooms"), (snapshot) => {
  const data = snapshot.val();
  roomList.innerHTML = "";

  if(!data){
    roomCount.innerText = "0";
    chatCount.innerText = "0";
    dbSizeEl.innerText = "0 KB";
    roomList.innerHTML = `<div class="empty-state">No Active Rooms Found</div>`;
    return;
  }

  // Calculate Stats
  let rooms = Object.keys(data).length;
  let chats = 0;
  
  // Calculate Payload Size (Approx Storage)
  const size = new Blob([JSON.stringify(data)]).size;
  dbSizeEl.innerText = (size / 1024).toFixed(2) + " KB";

  Object.keys(data).forEach((id) => {
    const roomData = data[id];
    let roomChats = roomData.chat ? Object.keys(roomData.chat).length : 0;
    chats += roomChats;

    const div = document.createElement("div");
    div.className = "room-item";
    
    // Tap to visit room logic
    div.onclick = (e) => {
        // Prevent click if clicking action buttons
        if(e.target.closest('.actions')) return;
        window.open(`https://www.asvm.fun/room?room=${id}`, '_blank');
    };

    div.innerHTML = `
      <div class="room-info">
        <div class="room-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 10l5 5-5 5M4 4v7a4 4 0 0 0 4 4h12"/></svg>
        </div>
        <div class="room-details">
          <h4>Room ID: ${id}</h4>
          <div class="room-url-text">${roomData.url || 'No Video URL'}</div>
          <div style="font-size:11px; color:var(--accent-primary); margin-top:5px;">● ${roomChats} messages</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-edit" onclick="editUrl('${id}', '${roomData.url || ''}')">
          Edit URL
        </button>
        <button class="btn btn-danger" style="padding:8px" onclick="deleteRoom('${id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    `;
    roomList.appendChild(div);
  });

  roomCount.innerText = rooms;
  chatCount.innerText = chats;
});

// Edit Function
window.editUrl = function(id, oldUrl) {
  const newUrl = prompt(`Editing Room: ${id}\n\nCurrent URL: ${oldUrl}\n\nEnter New URL:`, oldUrl);
  if(newUrl !== null && newUrl.trim() !== "") {
    update(ref(db, `rooms/${id}`), { url: newUrl.trim() });
  }
}

// Delete Single
window.deleteRoom = function(id) {
  if(confirm(`Room ${id} ko delete karein?`)) {
    remove(ref(db, `rooms/${id}`));
  }
}

// Delete All Data (New)
window.deleteAllRooms = function() {
  const code = prompt("Type 'DELETE ALL' to confirm cleaning all database rooms:");
  if(code === "DELETE ALL") {
    remove(ref(db, "rooms"))
      .then(() => alert("All data cleared successfully!"))
      .catch((e) => alert("Error: " + e.message));
  } else if (code !== null) {
    alert("Wrong code! Action cancelled.");
  }
}

</script>

</body>
</html>
