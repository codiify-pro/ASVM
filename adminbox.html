<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Modern SaaS Dark Mode Variables */
:root {
  --bg-base: #09090b;
  --bg-panel: #18181b;
  --bg-panel-hover: #27272a;
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  
  --accent-primary: #00dc82; /* Neon Mint */
  --accent-secondary: #f43f5e; /* Rose Red */
  --accent-blue: #0ea5e9; /* Sky Blue */
  
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-base);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-panel-hover); border-radius: 10px; }

/* Top Navigation */
.navbar {
  background: rgba(24, 24, 27, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: linear-gradient(45deg, var(--accent-primary), #00b4d8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}

.badge-admin {
  background: rgba(244, 63, 94, 0.1);
  color: var(--accent-secondary);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(244, 63, 94, 0.2);
}

/* Main Layout */
.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
  animation: fadeUp 0.6s var(--transition) forwards;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  transition: transform var(--transition), border-color var(--transition);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.stat-card:hover {
  transform: translateY(-5px);
  border-color: rgba(255, 255, 255, 0.2);
}

.stat-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.icon-mint { background: rgba(0, 220, 130, 0.1); color: var(--accent-primary); }
.icon-blue { background: rgba(14, 165, 233, 0.1); color: var(--accent-blue); }

.stat-info h3 {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
}

.stat-info h2 {
  margin: 5px 0 0 0;
  font-size: 32px;
  color: white;
  font-weight: 700;
}

/* Data Panel */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.panel-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.02);
}

.panel-header h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

.room-list {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 200px;
}

/* Individual Room Item */
.room-item {
  background: rgba(255, 255, 255, 0.015);
  border: 1px solid transparent;
  padding: 16px 20px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
}

.room-item:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(255, 255, 255, 0.1);
}

.room-main {
  display: flex;
  align-items: center;
  gap: 16px;
}

.room-avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #27272a;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}

.room-details h4 {
  margin: 0 0 6px 0;
  font-size: 16px;
  color: white;
  font-weight: 600;
}

.room-details .badges {
  display: flex;
  gap: 8px;
}

.room-badge {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Delete Button */
.btn-delete {
  background: rgba(244, 63, 94, 0.1);
  color: var(--accent-secondary);
  border: 1px solid rgba(244, 63, 94, 0.2);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}

.btn-delete:hover {
  background: var(--accent-secondary);
  color: white;
  box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
}

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-muted);
  text-align: center;
}

.empty-state svg {
  margin-bottom: 16px;
  opacity: 0.5;
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 600px) {
  .room-item { flex-direction: column; align-items: flex-start; gap: 16px; }
  .btn-delete { width: 100%; justify-content: center; }
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">ASVM</div>
  <div class="badge-admin">Admin Dashboard</div>
</div>

<div class="container">
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon icon-mint">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="stat-info">
        <h3>Active Rooms</h3>
        <h2 id="roomCount">0</h2>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon icon-blue">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <div class="stat-info">
        <h3>Total Messages</h3>
        <h2 id="chatCount">0</h2>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>Room Management</h2>
    </div>
    
    <div class="room-list" id="roomList">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <p>Loading rooms...</p>
      </div>
    </div>
  </div>

</div>


<script type="module">

// import your firebase config
import { db } from "/firebase.js";

// firebase database functions
import {
  ref,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


const roomList = document.getElementById("roomList");
const roomCount = document.getElementById("roomCount");
const chatCount = document.getElementById("chatCount");

onValue(ref(db,"rooms"),(snapshot)=>{

  const data = snapshot.val();
  roomList.innerHTML = "";

  let rooms = 0;
  let chats = 0;

  if(!data){
    roomCount.innerText = "0";
    chatCount.innerText = "0";
    roomList.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="3" y1="3" x2="21" y2="21"></line></svg>
        <h3>No Active Rooms</h3>
        <p style="font-size:13px; margin-top:5px;">Users haven't created any watch parties yet.</p>
      </div>
    `;
    return;
  }

  Object.keys(data).forEach((id)=>{
    rooms++;
    
    // Calculate how many chats are in this specific room
    let roomChats = 0;
    if(data[id].chat){
      roomChats = Object.keys(data[id].chat).length;
      chats += roomChats;
    }

    const div = document.createElement("div");
    div.className = "room-item";

    // Build the beautiful room card HTML
    div.innerHTML = `
      <div class="room-main">
        <div class="room-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
        </div>
        <div class="room-details">
          <h4>Room: ${id}</h4>
          <div class="badges">
            <span class="room-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              ${roomChats} Messages
            </span>
          </div>
        </div>
      </div>
      <button class="btn-delete" data-id="${id}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete Room
      </button>
    `;

    // Attach logic to the delete button
    div.querySelector(".btn-delete").onclick = () => {
      deleteRoom(id);
    };

    roomList.appendChild(div);
  });

  // Update Top Stats
  roomCount.innerText = rooms;
  chatCount.innerText = chats;

});

// Global Function so the button can call it
window.deleteRoom = function(id) {
  if(confirm("Are you sure you want to permanently close Room: " + id + "?")) {
    remove(ref(db, "rooms/" + id));
  }
}

</script>

</body>
</html>
