<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
/* Modern SaaS Dark Mode Variables */
:root {
  --bg-base: #09090b;
  --bg-panel: #18181b;
  --bg-panel-hover: #27272a;
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  
  --accent-primary: #00dc82; /* Neon Mint */
  --accent-secondary: #f43f5e; /* Rose Red */
  --accent-blue: #0ea5e9; /* Sky Blue */
  --accent-warn: #f59e0b; /* Orange Warning */
  
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-base);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-panel-hover); border-radius: 10px; }

/* Top Navigation */
.navbar {
  background: rgba(24, 24, 27, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: linear-gradient(45deg, var(--accent-primary), #00b4d8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}

.badge-admin {
  background: rgba(244, 63, 94, 0.1);
  color: var(--accent-secondary);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(244, 63, 94, 0.2);
}

/* Main Layout */
.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
  animation: fadeUp 0.6s var(--transition) forwards;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  transition: transform var(--transition), border-color var(--transition);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.stat-card:hover {
  transform: translateY(-5px);
  border-color: rgba(255, 255, 255, 0.2);
}

/* Special Layout for Storage Card */
.stat-card.storage-card {
  flex-direction: column;
  align-items: stretch;
  gap: 15px;
}
.storage-header {
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.5rem;
  flex-shrink: 0;
}

.icon-mint { background: rgba(0, 220, 130, 0.1); color: var(--accent-primary); }
.icon-blue { background: rgba(14, 165, 233, 0.1); color: var(--accent-blue); }
.icon-warn { background: rgba(245, 158, 11, 0.1); color: var(--accent-warn); }
.icon-purple { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }

.stat-info h3 {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
}

.stat-info h2 {
  margin: 5px 0 0 0;
  font-size: 32px;
  color: white;
  font-weight: 700;
}

/* Storage Slider UI */
.storage-slider-container {
  width: 100%;
}
.storage-stats-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 600;
}
.progress-track {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.02);
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-warn), #fcd34d);
  border-radius: 10px;
  transition: width 0.8s ease;
}

/* Data Panel */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.panel-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.02);
}

.panel-header h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.room-list {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 200px;
}

/* Individual Room Item */
.room-item {
  background: rgba(255, 255, 255, 0.015);
  border: 1px solid transparent;
  padding: 16px 20px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
}

.room-item:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(255, 255, 255, 0.1);
}

.room-main {
  display: flex;
  align-items: center;
  gap: 16px;
}

.room-avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #27272a;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 1.2rem;
}

.room-details h4 {
  margin: 0 0 6px 0;
  font-size: 16px;
  color: white;
  font-weight: 600;
}

.room-badge {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Action Buttons */
.action-buttons {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.btn-base {
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  outline: none;
  border: none;
}

.btn-edit {
  background: rgba(14, 165, 233, 0.1);
  color: var(--accent-blue);
  border: 1px solid rgba(14, 165, 233, 0.2);
}
.btn-edit:hover { background: var(--accent-blue); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }

.btn-clear {
  background: rgba(245, 158, 11, 0.1);
  color: var(--accent-warn);
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.btn-clear:hover { background: var(--accent-warn); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }

.btn-delete {
  background: rgba(244, 63, 94, 0.1);
  color: var(--accent-secondary);
  border: 1px solid rgba(244, 63, 94, 0.2);
}
.btn-delete:hover { background: var(--accent-secondary); color: white; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }

/* --- Edit Modal --- */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 2000;
    opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content {
    background: var(--bg-panel); width: 90%; max-width: 500px; padding: 24px;
    border-radius: 20px; border: 1px solid var(--border-color);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: translateY(20px); transition: 0.3s;
}
.modal-overlay.active .modal-content { transform: translateY(0); }

.modal-content h3 { margin-top: 0; margin-bottom: 20px; color: white; display: flex; align-items: center; gap: 10px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.form-group input { 
    width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
    color: white; border-radius: 10px; font-family: inherit; font-size: 14px; box-sizing: border-box;
}
.form-group input:focus { border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }
.form-group input[readonly] { color: var(--text-muted); background: rgba(255,255,255,0.02); cursor: not-allowed; }

.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
.btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s;}
.btn-cancel:hover { background: rgba(255,255,255,0.05); }
.btn-save { background: var(--accent-primary); color: #000; padding: 10px 20px; border: none; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s;}
.btn-save:hover { box-shadow: 0 4px 15px rgba(0, 220, 130, 0.4); transform: translateY(-2px); }

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-muted);
  text-align: center;
}
.empty-state i { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.5; color: var(--text-light); }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 768px) {
  .room-item { flex-direction: column; align-items: flex-start; gap: 16px; }
  .action-buttons { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .btn-delete { grid-column: span 2; justify-content: center; }
  .btn-edit, .btn-clear { justify-content: center; }
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">ASVM</div>
  <div class="badge-admin">Admin Dashboard</div>
</div>

<div class="container">
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon icon-purple">
        <i class="fas fa-hashtag"></i>
      </div>
      <div class="stat-info">
        <h3>Total Rooms</h3>
        <h2 id="roomCount">0</h2>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon icon-blue">
        <i class="fas fa-play"></i>
      </div>
      <div class="stat-info">
        <h3>Active Videos</h3>
        <h2 id="videoCount">0</h2>
      </div>
    </div>

    <div class="stat-card storage-card">
      <div class="storage-header">
        <div class="stat-icon icon-warn">
          <i class="fas fa-database"></i>
        </div>
        <div class="stat-info">
          <h3>Database Storage</h3>
          <h2 id="storageCount">0 KB</h2>
        </div>
      </div>
      <div class="storage-slider-container">
        <div class="storage-stats-text">
          <span>Used Space</span>
          <span id="storagePercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="storageBar"></div>
        </div>
        <div style="font-size: 10px; color: var(--text-muted); margin-top: 6px; text-align: right;">Max: 1 GB (Free Tier)</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2><i class="fas fa-server" style="color:var(--text-muted); margin-right:8px;"></i> Room Management</h2>
    </div>
    
    <div class="room-list" id="roomList">
      <div class="empty-state">
        <i class="fas fa-circle-notch fa-spin"></i>
        <p>Loading rooms...</p>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3><i class="fas fa-link" style="color:var(--accent-blue);"></i> Edit Video URL</h3>
        <p style="font-size:13px; color:var(--text-muted); margin-top:-15px; margin-bottom:20px;">Room ID: <strong id="modalRoomId" style="color:white;"></strong></p>
        
        <div class="form-group">
            <label>Current URL (Old)</label>
            <input type="text" id="currentUrlInput" readonly value="No video set">
        </div>
        
        <div class="form-group">
            <label>New Source URL</label>
            <input type="text" id="newUrlInput" placeholder="Enter new MP4 / M3U8 / YouTube link...">
        </div>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" id="saveUrlBtn">Update Now</button>
        </div>
    </div>
</div>

<script type="module">
// import your firebase config
import { db } from "./firebase.js";

// firebase database functions
import {
  ref,
  onValue,
  remove,
  set
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const roomList = document.getElementById("roomList");
const roomCount = document.getElementById("roomCount");
const videoCount = document.getElementById("videoCount");
const storageCount = document.getElementById("storageCount");
const storageBar = document.getElementById("storageBar");
const storagePercent = document.getElementById("storagePercent");

// Modal Logic
let editingRoomId = null;

window.closeEditModal = () => {
    document.getElementById('editModal').classList.remove('active');
    setTimeout(() => { document.getElementById('editModal').style.display = 'none'; }, 300);
}

window.openEditModal = (roomId, currentSrc) => {
    editingRoomId = roomId;
    document.getElementById('modalRoomId').innerText = roomId;
    
    // Direct raw URL mapping (No base64 extraction)
    let oldUrlText = "No video active currently";
    if (currentSrc && currentSrc !== "null" && currentSrc.trim() !== "") {
         oldUrlText = currentSrc;
    }
    
    document.getElementById('currentUrlInput').value = oldUrlText;
    document.getElementById('newUrlInput').value = "";
    
    document.getElementById('editModal').style.display = 'flex';
    setTimeout(() => { document.getElementById('editModal').classList.add('active'); }, 10);
}

// Handle Save in Modal (Stores RAW URL to Firebase)
document.getElementById('saveUrlBtn').addEventListener('click', () => {
    const newUrl = document.getElementById('newUrlInput').value.trim();
    if (!newUrl) return alert("Please enter a valid URL!");
    if (!editingRoomId) return;

    // Direct String write to database
    set(ref(db, "rooms/" + editingRoomId + "/src"), newUrl)
      .then(() => {
          closeEditModal();
      })
      .catch((e) => alert("Error updating URL: " + e));
});

// Fetch Data from Firebase
onValue(ref(db, "rooms"), (snapshot) => {

  const data = snapshot.val();
  roomList.innerHTML = "";

  let rooms = 0;
  let activeVideos = 0;

  // Real-time Storage Calculation
  let sizeInBytes = data ? new Blob([JSON.stringify(data)]).size : 0;
  
  // Format Size
  let sizeInKB = sizeInBytes / 1024;
  let sizeInMB = sizeInKB / 1024;
  storageCount.innerText = sizeInMB > 1 ? sizeInMB.toFixed(2) + " MB" : sizeInKB.toFixed(2) + " KB";

  // Calculate Progress percentage (Max 1GB = 1,073,741,824 bytes)
  const maxBytes = 1073741824; 
  let percent = (sizeInBytes / maxBytes) * 100;
  if(percent < 0.1 && sizeInBytes > 0) percent = 0.5; // Visual minimum if data exists
  
  storageBar.style.width = percent + "%";
  storagePercent.innerText = percent < 0.01 && sizeInBytes > 0 ? "< 0.01%" : percent.toFixed(2) + "%";

  if(!data){
    roomCount.innerText = "0";
    videoCount.innerText = "0";
    roomList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-box-open"></i>
        <h3>No Active Rooms Found</h3>
        <p style="font-size:13px; margin-top:5px;">Create a room by accessing the player URL directly.</p>
      </div>
    `;
    return;
  }

  Object.keys(data).forEach((id) => {
    rooms++;
    const roomData = data[id] || {};

    let currentSrc = roomData.src || "null";
    let hasVideo = roomData.src && roomData.src.trim() !== "" ? true : false;
    
    if (hasVideo) activeVideos++;
    
    let videoBadge = hasVideo 
        ? `<span class="room-badge" style="color:var(--accent-primary); border-color:rgba(0,220,130,0.2); background:rgba(0,220,130,0.05);"><i class="fas fa-play"></i> Active Video</span>` 
        : `<span class="room-badge" style="color:var(--accent-warn); border-color:rgba(245,158,11,0.2); background:rgba(245,158,11,0.05);"><i class="fas fa-exclamation-circle"></i> No Video</span>`;

    const div = document.createElement("div");
    div.className = "room-item";

    // Encode currentSrc before injecting to HTML attribute to avoid quote breaking HTML structure
    let safeSrcData = encodeURIComponent(currentSrc);

    div.innerHTML = `
      <div class="room-main">
        <div class="room-avatar">
          <i class="fas fa-tv"></i>
        </div>
        <div class="room-details">
          <h4>${id}</h4>
          <div class="badges">
            ${videoBadge}
          </div>
        </div>
      </div>
      
      <div class="action-buttons">
          <button class="btn-base btn-edit" data-id="${id}" data-src="${safeSrcData}">
            <i class="fas fa-edit"></i> Edit URL
          </button>
          
          <button class="btn-base btn-clear" data-id="${id}">
            <i class="fas fa-unlink"></i> Clear URL
          </button>
          
          <button class="btn-base btn-delete" data-id="${id}">
            <i class="fas fa-trash-alt"></i> Delete Room
          </button>
      </div>
    `;

    roomList.appendChild(div);

    // Event Listeners for action buttons
    div.querySelector(`.btn-edit`).addEventListener("click", function() {
        let decodedSrcAttr = decodeURIComponent(this.getAttribute('data-src'));
        openEditModal(this.getAttribute('data-id'), decodedSrcAttr);
    });

    div.querySelector(`.btn-clear`).addEventListener("click", function() {
      const targetId = this.getAttribute('data-id');
      if(confirm("Are you sure you want to clear the video URL for Room: " + targetId + "?")) {
        remove(ref(db, "rooms/" + targetId + "/src")).catch((e) => alert("Error clearing URL: " + e));
      }
    });

    div.querySelector(`.btn-delete`).addEventListener("click", function() {
      const targetId = this.getAttribute('data-id');
      if(confirm("Permanently delete Room: " + targetId + " ?")) {
        remove(ref(db, "rooms/" + targetId));
      }
    });

  });

  // Update Counters
  roomCount.innerText = rooms;
  videoCount.innerText = activeVideos;

});

</script>

</body>
</html>
