<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASVM - Sync Video Meeting Room</title>
<!-- Favicon -->
<link rel="icon" type="image/png" href="https://www.asvm.fun/20260310_010041.jpg">
<link rel="shortcut icon" href="https://www.asvm.fun/20260310_010041.jpg" type="image/png">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Modern SaaS Dark Mode Variables */
:root {
  --bg-base: #09090b;
  --bg-panel: #18181b;
  --bg-panel-hover: #27272a;
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  
  --accent-primary: #00dc82; /* Neon Mint */
  --accent-secondary: #f43f5e; /* Rose Red */
  
  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
  
  --shadow-ambient: 0 0 40px rgba(0, 0, 0, 0.5);
  
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  margin: 0;
  background: var(--bg-base);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-panel-hover); border-radius: 10px; }

/* Topbar */
.topbar {
  background: rgba(24, 24, 27, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  font-weight: 600;
  letter-spacing: -0.02em;
  position: sticky;
  top: 0;
  z-index: 10;
  height: 60px;
  box-sizing: border-box;
}

/* Premium ASVM Logo */
.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: linear-gradient(45deg, var(--accent-primary), #00b4d8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  animation: fadeUp 0.5s ease-out forwards;
}

.room {
  color: var(--accent-primary);
  background: rgba(0, 220, 130, 0.1);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  border: 1px solid rgba(0, 220, 130, 0.2);
}

/* Layout Container */
.main-container {
  max-width: 950px;
  margin: 0 auto;
  padding: 30px 20px 10px 20px;
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 60px); 
  box-sizing: border-box;
}

/* Player */
.playerWrap {
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-ambient);
  border: 1px solid var(--border-color);
  animation: fadeUp 0.6s var(--transition) forwards;
  flex-shrink: 0; 
}

video {
  width: 100%;
  display: block;
}

/* Glowing Divider */
.section-divider {
  margin: 30px 0;
  height: 1px;
  width: 100%;
  border: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  animation: fadeUp 0.7s var(--transition) forwards;
  flex-shrink: 0;
}

/* Embedded Chat Box */
.chatBox {
  width: 100%;
  flex: 1; 
  min-height: 400px; 
  background: rgba(24, 24, 27, 0.5);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex; 
  flex-direction: column;
  overflow: hidden;
  animation: fadeUp 0.8s var(--transition) forwards;
}

.chatHeader {
  background: rgba(255, 255, 255, 0.03);
  padding: 16px 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-color);
}

/* Live indicator dot */
.live-dot {
  width: 8px;
  height: 8px;
  background: var(--accent-secondary);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-secondary);
  animation: pulse 2s infinite;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Message Bubbles */
.msg {
  display: flex;
  width: 100%;
  animation: messagePop 0.4s var(--transition) forwards;
}

.msgBox {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
}

.left { justify-content: flex-start; }
.left .msgBox {
  background: var(--bg-panel-hover);
  color: var(--text-main);
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
}

.right { justify-content: flex-end; }
.right .msgBox {
  background: var(--accent-secondary);
  color: white;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 15px rgba(244, 63, 94, 0.2);
}

.name {
  font-weight: 600;
  font-size: 12px;
  margin-bottom: 4px;
  opacity: 0.8;
  letter-spacing: 0.02em;
}

/* Input Area */
.chatInput {
  display: flex;
  padding: 16px;
  background: rgba(0, 0, 0, 0.2);
  border-top: 1px solid var(--border-color);
  gap: 10px;
}

.chatInput input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-base);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  transition: border-color var(--transition);
}

.chatInput input:focus {
  outline: none;
  border-color: var(--accent-secondary);
  box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
}

.chatInput button {
  background: var(--accent-secondary);
  border: none;
  color: white;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.2s;
}

.chatInput button:hover {
  background: #e11d48;
  transform: translateY(-2px);
}

/* Footer Area */
.footer {
  text-align: center;
  padding: 24px 0 10px 0;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.05em;
  animation: fadeUp 1s var(--transition) forwards;
}

/* Popup Notification */
.popup {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-panel);
  border: 1px solid var(--accent-primary);
  color: var(--accent-primary);
  padding: 12px 24px;
  border-radius: 30px;
  display: none;
  font-weight: 500;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(0, 220, 130, 0.15);
  z-index: 1000;
  animation: slideDown 0.4s var(--transition) forwards;
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes messagePop {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes slideDown {
  0% { opacity: 0; transform: translate(-50%, -20px); }
  100% { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(244, 63, 94, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
}

/* Responsive */
@media(max-width: 768px) {
  .main-container { padding: 20px 16px 10px 16px; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">ASVM</div>
  <div class="room" id="roomId"></div>
</div>

<div class="main-container">
  
  <div class="playerWrap">
    <video id="player" controls playsinline preload="auto"></video>
  </div>

  <hr class="section-divider">

  <div class="chatBox" id="chat">
    <div class="chatHeader">
      <div class="live-dot"></div>
      <span>Room Chat</span>
    </div>

    <div id="messages"></div>

    <div class="chatInput">
      <input id="msg" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
      <button onclick="sendMsg()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <div class="footer">
    &copy; 2026 ASVM | All Rights Reserved
  </div>

</div>

<div class="popup" id="joinPopup"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script type="module">
import {db,ref,onValue,update,push,onChildAdded} from "./firebase.js"

const params=new URLSearchParams(location.search)
const room=params.get("room")

document.getElementById("roomId").innerText="Room: "+room

const video=document.getElementById("player")
const player=new Plyr(video)

const msgSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

let sourceLoaded=false

/* cookies */
function getCookie(name){
let match=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'))
if(match) return match[2]
}

function setCookie(name,value,days){
let d=new Date()
d.setTime(d.getTime()+(days*24*60*60*1000))
document.cookie=name+"="+value+";expires="+d.toUTCString()+";path=/"
}

let username=getCookie("watchparty_name")

if(!username){
username=prompt("Enter your name")
if(username){
setCookie("watchparty_name",username,30)
}
}

/* block right click */
document.addEventListener("contextmenu",e=>e.preventDefault())

/* join notification */
push(ref(db,"rooms/"+room+"/joins"),{
name:username,
time:Date.now()
})

onChildAdded(ref(db,"rooms/"+room+"/joins"),(snap)=>{
const j=snap.val()
if(j.name!==username){
showPopup(j.name+" joined room")
}
})

/* Load video source ONLY (Fixed Sound System) */
onValue(ref(db,"rooms/"+room),(snap)=>{

const data=snap.val()
if(!data) return

const url=atob(data.src)

if(!sourceLoaded){

player.source = {
type: "video",
sources: [
{
src: url,
type: "video/mp4"
}
]
}

// ensure clean audio output
video.muted=false
video.volume=1

player.on('ready',()=>{
video.muted=false
video.volume=1
})

sourceLoaded=true
}

})

/* chat */

window.handleKeyPress=function(e){
if(e.key==="Enter"){
sendMsg()
}
}

window.sendMsg=function(){

const text=document.getElementById("msg").value
if(!text) return

push(ref(db,"rooms/"+room+"/chat"),{
name:username,
text:text,
time:Date.now()
})

document.getElementById("msg").value=""

}

onChildAdded(ref(db,"rooms/"+room+"/chat"),(snap)=>{

const m=snap.val()
const box=document.getElementById("messages")
const div=document.createElement("div")

const isMe=m.name===username

if(!isMe){
msgSound.play().catch(e=>console.log("Sound autoplay blocked by browser"))
}

div.className="msg "+(isMe?"right":"left")

div.innerHTML=`
<div class="msgBox">
<div class="name">${m.name}</div>
${m.text}
</div>
`

box.appendChild(div)
box.scrollTop=box.scrollHeight

})

function showPopup(text){

const p=document.getElementById("joinPopup")

p.innerText=text
p.style.display="block"

setTimeout(()=>{
p.style.display="none"
},3000)

}
</script>

</body>
</html>
